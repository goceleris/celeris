; PgBouncer WITHOUT prepared-statement support, for the Drivers workflow
; (postgres-pgbouncer job). Same as ../pgbouncer/pgbouncer.ini except
; max_prepared_statements=0 (PgBouncer then passes a Parse of a named statement
; to the server connection as is, and never tracks or renames it) and port 6433.
; Transaction mode only, pool_size=2: several clients share two server
; connections, which is where two clients that name a statement the same would
; run each other's SQL (celeris#1455).
[databases]
celeris_txn = host=127.0.0.1 port=5432 dbname=celeristest pool_mode=transaction pool_size=2

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6433
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = celeris
pidfile = /tmp/pgbouncer-noprep.pid
max_prepared_statements = 0

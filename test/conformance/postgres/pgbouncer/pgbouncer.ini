; PgBouncer for the Drivers workflow (postgres-pgbouncer job). PgBouncer runs in
; the host network next to the Postgres service container and is reached on
; 127.0.0.1:6432. Two databases, one per pool mode, both pointing at the
; service's celeristest database. ignore_startup_parameters is NOT set on
; purpose: PgBouncer then answers a startup parameter it does not track
; (extra_float_digits, bytea_output, ...) with a FATAL error and closes the
; connection, which is what the test must catch if the driver ever sends one.
[databases]
celeris_txn = host=127.0.0.1 port=5432 dbname=celeristest pool_mode=transaction pool_size=2
celeris_session = host=127.0.0.1 port=5432 dbname=celeristest pool_mode=session

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = celeris
pidfile = /tmp/pgbouncer.pid

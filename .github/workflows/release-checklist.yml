name: Release Checklist

# Opens the "bump the version" reminder when a version milestone is created.
#
# This replaces an attempt to automate the release itself. That attempt could
# not be made safe: GitHub fires no workflow for the created, edited or
# deleted activity types on DRAFT releases, so nothing can prepare anything
# while a release is still a draft, and the tag therefore exists the instant
# Publish is clicked. A stale stamp at that moment can only be repaired by
# moving the tag, and a published tag must never move — every one is recorded
# in sum.golang.org, where a moved tag gives existing consumers a checksum
# mismatch that reads as a supply-chain compromise.
#
# So the stamps have to be right BEFORE the tag exists, and the reliable way
# to achieve that is a reminder early enough to act on, not machinery racing
# the module proxy. A milestone is created at the start of a release cycle,
# which is exactly when the reminder is useful.
#
# The body is generated by `mage ReleaseChecklist` from the same list
# mage CheckRelease enforces, so it cannot drift from what is actually
# checked.

on:
  milestone:
    types: [created]

permissions:
  contents: read

jobs:
  checklist:
    name: Open the version-bump checklist
    # Milestones are also used for non-release tracks (Research, Horizon), and
    # those need no version bump. Only vX.Y.Z and vX.Y.Z-rc.N qualify.
    if: startsWith(github.event.milestone.title, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mage
        run: go install github.com/magefile/mage@v1.17.2

      - name: Render the checklist
        id: body
        env:
          VERSION: ${{ github.event.milestone.title }}
        run: |
          set -euo pipefail
          # A milestone title that is not a version is not an error: the guard
          # above lets through anything starting with "v", and mage rejects
          # the rest. Exit quietly rather than failing a maintainer's
          # unrelated milestone.
          if ! mage ReleaseChecklist > /tmp/checklist.md 2>/tmp/checklist.err; then
            echo "not a release milestone ($VERSION); nothing to do"
            cat /tmp/checklist.err
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Open the issue
        if: steps.body.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.milestone.title }}
          MILESTONE: ${{ github.event.milestone.title }}
        run: |
          set -euo pipefail
          # Re-opening the same checklist on every milestone edit would be
          # noise, and `milestone: created` can fire again if a milestone is
          # deleted and remade. One per version is enough.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --search "in:title \"Release checklist: $VERSION\"" \
            --json number,title --jq '[.[] | select(.title == "Release checklist: '"$VERSION"'")] | .[0].number // empty')
          if [ -n "$existing" ]; then
            echo "already open as #$existing"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Release checklist: $VERSION" \
            --body-file /tmp/checklist.md \
            --milestone "$MILESTONE"

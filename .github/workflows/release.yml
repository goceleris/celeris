name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    steps:
      - name: Check semver format
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not valid semver (expected vX.Y.Z or vX.Y.Z-beta.N)"
            exit 1
          fi
          echo "Tag $TAG is valid"

  ci:
    name: CI
    needs: validate-tag
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects the `$/` form

  tag-submodules:
    name: Tag Sub-Modules
    needs: [validate-tag, ci]
    runs-on: ubuntu-latest
    # The only job that writes to the repository (pushes sub-module tags).
    permissions:
      contents: write
    steps:
      # Keeps the job token: this is the one step that pushes (sub-module tags).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked]
          fetch-depth: 0
      - name: Create sub-module tags
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          SUBMODULES="middleware/compress middleware/metrics middleware/otel middleware/protobuf"
          for sub in $SUBMODULES; do
            TAG="${sub}/${VERSION}"
            if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists, skipping"
            else
              echo "Creating tag ${TAG}"
              git tag "${TAG}"
            fi
          done
          git push origin --tags
      - name: Update sub-module go.mod versions
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          SUBMODULES="middleware/compress middleware/metrics middleware/otel middleware/protobuf"
          for sub in $SUBMODULES; do
            GOMOD="${sub}/go.mod"
            if [ -f "$GOMOD" ]; then
              echo "Checking ${GOMOD} for stale celeris version..."
              CURRENT=$(grep 'github.com/goceleris/celeris ' "$GOMOD" | awk '{print $2}')
              if [ "$CURRENT" != "$VERSION" ]; then
                echo "::warning::${GOMOD} pins celeris ${CURRENT}, not ${VERSION}. Update before next sub-module release."
              else
                echo "${GOMOD} already at ${VERSION}"
              fi
            fi
          done

  notify-proxy:
    name: Notify Go Proxy
    needs: [validate-tag, ci, tag-submodules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: false
      - name: Request root module from proxy
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          MODULE="github.com/goceleris/celeris"
          echo "Notifying proxy for ${MODULE}@${VERSION}..."
          for attempt in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://proxy.golang.org/${MODULE}/@v/${VERSION}.info")
            if [ "$STATUS" = "200" ]; then
              echo "Proxy responded with 200 for ${MODULE}@${VERSION}"
              break
            fi
            echo "Attempt $attempt: proxy returned $STATUS, retrying in 10s..."
            sleep 10
          done
      - name: Request sub-module versions from proxy
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          SUBMODULES="middleware/compress middleware/metrics middleware/otel middleware/protobuf"
          for sub in $SUBMODULES; do
            MODULE="github.com/goceleris/celeris/${sub}"
            echo "Notifying proxy for ${MODULE}@${VERSION}..."
            for attempt in 1 2 3; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://proxy.golang.org/${MODULE}/@v/${VERSION}.info")
              if [ "$STATUS" = "200" ]; then
                echo "Proxy responded with 200 for ${MODULE}@${VERSION}"
                break
              fi
              echo "Attempt $attempt: proxy returned $STATUS, retrying in 10s..."
              sleep 10
            done
          done
      - name: Verify module availability
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          go list -m "github.com/goceleris/celeris@${VERSION}" || echo "Root module not yet indexed"
          go list -m "github.com/goceleris/celeris/middleware/compress@${VERSION}" || echo "compress sub-module not yet indexed"
          go list -m "github.com/goceleris/celeris/middleware/metrics@${VERSION}" || echo "metrics sub-module not yet indexed"
          go list -m "github.com/goceleris/celeris/middleware/otel@${VERSION}" || echo "otel sub-module not yet indexed"
          go list -m "github.com/goceleris/celeris/middleware/protobuf@${VERSION}" || echo "protobuf sub-module not yet indexed"

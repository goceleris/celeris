# CodSpeed: continuous benchmarking of the request hot path (celeris#690).
#
# What it measures: the standard `testing.B` benchmarks of the code every
# request runs through -- the router, Context and handler chain (root
# bench_test.go), the HTTP/1 parser, protocol detection and the H2 stream
# pool (./protocol/...), the wake-fd primitive (./internal/...), the core
# middleware chains (./middleware) and the logger. Nothing in the benchmarks
# changed: CodSpeed's Go runner builds them with an overlay of `testing` and
# measures each one (https://codspeed.io/docs/benchmarks/go).
#
# Not measured, on purpose: test/drivercmp/* and test/benchcmp_* (separate
# modules that need Redis, Postgres or Memcached), driver/* (same), the
# middleware sub-modules (own go.mod), middleware/websocket (real sockets),
# and the engines. Engine throughput is judged on real hardware by
# goceleris/probatorium's cluster matrix, not by micro-benchmarks, and the
# engines change so often that watching them here would spend the whole
# monthly budget (see below).
#
# Where it runs: a CodSpeed Macro Runner, a dedicated bare-metal machine.
# Go supports only the walltime instrument, and walltime on a shared
# GitHub-hosted VM is too noisy to catch a regression. A report is only
# compared with a baseline measured on the same machine type.
#
# Only the arm64 Graviton runner is used: it is the one runner the CodSpeed
# Free plan (the open-source plan) includes, 600 minutes a month. The Ryzen
# x64 runner is Pro-only. arm64 == x86 parity for a release stays with
# probatorium's cluster.
#
# PREREQUISITE (an org setting, not code): Organization settings -> Actions
# -> Runner groups -> Default -> allow public repositories. Until that is
# set, the job below waits in the queue for a runner that never comes. That
# is expected and is not a failure of this workflow.
#
# Security: a macro runner is a self-hosted runner outside GitHub's
# sandbox, so code from a FORK pull request never runs on it (the job's
# `if:` below). Same-repository branches can only be pushed by people with
# write access. No pull_request_target, no secrets: the upload
# authenticates with the job's OIDC token.
#
# Budget (600 macro-runner minutes a month). The trigger paths below are the
# non-test code of every package the benchmark set executes (measured: the
# set run once with -coverpkg over the whole module), the benchmark files
# themselves, the root go.mod/go.sum and this file. Replaying the 30 days to
# 2026-09-26 -- the busiest month on record, 113 pushes to main and 268
# pushes to pull requests -- through those paths gives the run count;
# SETUP.md in the evidence for celeris#690 has the arithmetic and the
# per-run minutes. -benchtime=1s instead of the runner's 3s default is what
# keeps that month inside the budget; raise it if the minutes allow.
name: CodSpeed

on:
  push:
    branches: [main]
    paths:
      - "*.go"
      - "celeristest/**"
      - "internal/**"
      - "observe/**"
      - "protocol/**"
      - "middleware/*.go"
      - "middleware/adapters/**"
      - "middleware/circuitbreaker/**"
      - "middleware/cors/**"
      - "middleware/etag/**"
      - "middleware/internal/**"
      - "middleware/logger/**"
      - "middleware/methodoverride/**"
      - "middleware/pprof/**"
      - "middleware/proxy/**"
      - "middleware/ratelimit/**"
      - "middleware/recovery/**"
      - "middleware/redirect/**"
      - "middleware/requestid/**"
      - "middleware/rewrite/**"
      - "middleware/secure/**"
      - "middleware/singleflight/**"
      - "middleware/static/**"
      - "middleware/swagger/**"
      - "middleware/timeout/**"
      - "!mage*.go"
      - "!**/*_test.go"
      - "*bench*_test.go"
      - "internal/**/*bench*_test.go"
      - "protocol/**/*bench*_test.go"
      - "protocol/detect/detect_test.go"
      - "protocol/h2/stream/intern_test.go"
      - "protocol/h2/stream/stream_test.go"
      - "middleware/*bench*_test.go"
      - "middleware/logger/*bench*_test.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/codspeed.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "*.go"
      - "celeristest/**"
      - "internal/**"
      - "observe/**"
      - "protocol/**"
      - "middleware/*.go"
      - "middleware/adapters/**"
      - "middleware/circuitbreaker/**"
      - "middleware/cors/**"
      - "middleware/etag/**"
      - "middleware/internal/**"
      - "middleware/logger/**"
      - "middleware/methodoverride/**"
      - "middleware/pprof/**"
      - "middleware/proxy/**"
      - "middleware/ratelimit/**"
      - "middleware/recovery/**"
      - "middleware/redirect/**"
      - "middleware/requestid/**"
      - "middleware/rewrite/**"
      - "middleware/secure/**"
      - "middleware/singleflight/**"
      - "middleware/static/**"
      - "middleware/swagger/**"
      - "middleware/timeout/**"
      - "!mage*.go"
      - "!**/*_test.go"
      - "*bench*_test.go"
      - "internal/**/*bench*_test.go"
      - "protocol/**/*bench*_test.go"
      - "protocol/detect/detect_test.go"
      - "protocol/h2/stream/intern_test.go"
      - "protocol/h2/stream/stream_test.go"
      - "middleware/*bench*_test.go"
      - "middleware/logger/*bench*_test.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/codspeed.yml"
  # Backtests: CodSpeed dispatches this to measure older commits, and it is
  # the manual way to take a fresh baseline.
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request: a new push cancels the one in flight, so a
# burst of pushes costs one run. Pushes to main are never cancelled -- each
# is a baseline -- but a burst still collapses to the newest pending one.
concurrency:
  group: codspeed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    name: Benchmarks (arm64 macro runner)
    # Fork pull requests never reach a macro runner; drafts wait until they
    # are marked ready (ready_for_review above), to save minutes.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft)
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    # A hang must not burn the month's minutes. A full run is a few minutes.
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      id-token: write # CodSpeed upload over OIDC, so no upload token is stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          # The CodSpeed Go runner builds with its own fresh GOCACHE and
          # GOMODCACHE, so a restored setup-go cache would never be read.
          cache: false
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        env:
          # Frame-pointer unwinding: DWARF unwinding leaves Go flamegraphs
          # incomplete on arm64 (https://codspeed.io/docs/benchmarks/go).
          CODSPEED_PERF_UNWINDING_MODE: fp
        with:
          mode: walltime
          # Pinned: a runner change can move every number, and 1.3.0 is the
          # first release that supports Go 1.27. Bump it deliberately.
          go-runner-version: "1.3.0"
          run: go test -bench=. -benchtime=1s . ./protocol/... ./internal/... ./middleware ./middleware/logger

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Flaky jobs (`test`, `spec`, `integration`, `bench`) were removed
# 2026-04-28. They timed out unpredictably on shared GitHub Actions
# runners — race-detector + Azure-runner-cold-start blew the
# TestAdaptiveH2DialNoRSTRace bind deadline; h2spec hit timing limits
# under -race; integration's fakePG harness wedged on extended-protocol
# queries. Real correctness validation lives in the adversarial cluster
# matrix run by goceleris/probatorium (race + checkptr + fail-fast on
# real hardware) and the spec/integration tests run locally before merge.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          # The api/ check type-checks the nested modules too, and apidump
          # builds from the tools module, so their go.sum files key the cache.
          cache-dependency-path: |
            go.sum
            middleware/*/go.sum
            .github/tools/go.sum
      # Magefiles carry `//go:build mage`, so `go vet ./...`, `go build` and
      # `go test` ALL skip them — only mage itself compiles them, which means a
      # broken magefile can reach main green. Compile them here.
      - name: Install mage
        run: |
          go install github.com/magefile/mage@v1.17.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: mage compiles
        run: mage -compile /tmp/mage-compile-check
      # Every hand-written version stamp (server.go Version, the sub-module
      # pins, the README heading) must agree; the release workflow refuses to
      # tag while they disagree with the tag, and this refuses a PR that
      # leaves them disagreeing with each other. `VERSION=vX.Y.Z mage
      # PrepRelease` moves all of them at once.
      - name: Release stamps agree
        run: mage CheckRelease
      # api/ lists the exported API of every package (api/README.md). A PR
      # that adds, removes or changes an exported identifier regenerates it
      # with `mage api`, so the API change is part of the review; this step
      # fails with the diff when it did not (celeris#443). It runs in this
      # job because Lint is a required check, so a stale api/ cannot merge.
      # apidump is built from .github/tools, pinned by its go.sum like
      # govulncheck.
      - name: api/ matches the exported API
        run: go -C .github/tools run ./apidump
      - name: apidump's own tests
        run: go -C .github/tools test -count=1 ./apidump

      - name: Lint root module
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14
      - name: Lint middleware/compress
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14
          working-directory: middleware/compress
      - name: Lint middleware/metrics
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14
          working-directory: middleware/metrics
      - name: Lint middleware/otel
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14
          working-directory: middleware/otel
      - name: Lint middleware/protobuf
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14
          working-directory: middleware/protobuf
      # The tools module holds apidump's source (the api/ check above);
      # golangci-lint finds the root .golangci.yml from there.
      - name: Lint .github/tools
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14
          working-directory: .github/tools
      - name: actionlint
        # Workflow-YAML lint: catches script-injection vectors, unknown
        # runner labels, malformed shell, action input misuse — the
        # whole class golangci-lint can't see. Pinned to an exact version
        # so a new actionlint release cannot turn main red on its own.
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint -color
      - name: zizmor
        # Workflow security audit (unpinned actions, persisted credentials,
        # template injection, excessive permissions). Complements
        # actionlint, which checks syntax rather than security posture.
        # Needs only the ephemeral job token (read) for the online audits;
        # no repository secrets. Pinned to an exact version.
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec zizmor==1.30.0 zizmor --color always .github/workflows

  unit:
    name: Unit (root + middleware sub-modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      # Excludes ./test/... to keep this job deterministic — those
      # suites (integration, spec, sustainedload) are timing-sensitive
      # on shared GitHub Actions runners and run locally / in the
      # goceleris/probatorium cluster matrix instead.
      #
      # Excludes ./adaptive/... because it runs in its own job, `adaptive`
      # below, which raises memlock so the up-switch tests execute
      # (celeris#641).
      #
      # Excludes ./engine/iouring, which runs in the next step on its own,
      # with -v and every skip accounted for (celeris#662 r6).
      #
      # Excludes ./middleware/websocket because TestNativeEngineClose
      # FrameEcho/io_uring drives 13 close-handshake round trips on a
      # native io_uring engine and intermittently overruns its 30s
      # sub-test budget on Azure runners under -race (each handshake is
      # ~2-3s on a cold instance). The same suite is race-clean on
      # msr1 + Multipass and is exercised end-to-end by the
      # autobahn-fuzzingclient test under `mage testAutobahn`.
      # The named-test step at the end of this job is what covers the
      # parts of that package which CAN run here.
      - name: Root module — race tests (excluding test/ + adaptive/ + websocket + engine/iouring)
        run: |
          pkgs=$(go list ./... | grep -vE '/test/|/adaptive($|/)|/middleware/websocket($|/)|/engine/iouring$')
          # shellcheck disable=SC2086  # word-splitting is intentional — `go test` wants one package per arg
          go test -race -count=1 -timeout=300s $pkgs
      # celeris#662 r6: ./engine/iouring, on its own, at the runner's own 8 MiB
      # memlock, with -v, where no skip goes unseen.
      #
      # It used to run inside the step above, without -v, so a skip printed
      # nothing and the package still reported `ok`. That lost two tests.
      # TestListenWithCancelledContextPublishesTheBoundAddress and
      # TestListenRefusesToStartWhenNoWorkerReportsItsAddress (celeris#639)
      # start engines back to back, and the kernel charges ring memory to
      # RLIMIT_MEMLOCK and gives it back asynchronously, 12-23 ms after a ring
      # closes. At 8 MiB a start made inside that window got ENOMEM, which the
      # two read as "io_uring unavailable" and skipped: the first in every
      # 8 MiB run on record, the second in most. They now retry that ENOMEM
      # (ring_budget_linux_test.go) and fail rather than skip when io_uring
      # works.
      #
      # Two things keep a loss like that from happening quietly again:
      #   * the package runs alone. The kernel's count is per UID, so in the
      #     step above every package that starts io_uring engines drew on the
      #     same 8 MiB as this one, at the same time;
      #   * the tally fails the step on ANY `--- SKIP` line, subtests
      #     included, except the skips another step runs with the environment
      #     they need and skipping forbidden: the three celeris#656
      #     init-failure tests (they need two io_uring workers; job `iouring`
      #     raises memlock) and the celeris#662 synack=0 pair (they need
      #     net.ipv4.tcp_synack_retries=0; the synack step below sets it).
      #     The two celeris#639 tests must also each run and PASS by name, so
      #     a rename or a removal fails it too.
      #
      # 8 MiB funds one io_uring worker through the Listen path (12 MiB per
      # worker, engine/iouring/ring.go minMemlockPerWorker), the shape the
      # celeris#657 step below also needs. It runs even when the step above
      # failed: the two share no package.
      - name: engine/iouring — race tests at the runner's memlock (every skip accounted for)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          go test -race -count=1 -timeout=300s -v ./engine/iouring/ 2>&1 | tee /tmp/iouring-pkg.log
          allowed='TestListenClosesListenSocketsWhenEveryWorkerRingSetupFails|TestListenClosesListenSocketWhenOneWorkerRingSetupFails|TestListenClosesListenSocketRingAndEventfdWhenInitialSubmitFails|TestPauseAcceptServesDeferredIdleConnectionsSynackRetriesZero|TestPauseAcceptNoGuardLosesAtSynackRetriesZero'
          required='TestListenWithCancelledContextPublishesTheBoundAddress|TestListenRefusesToStartWhenNoWorkerReportsItsAddress'
          want=$(( $(tr '|' '\n' <<<"$required" | wc -l) ))
          ran=$(grep -cE "^=== RUN   (${required})\$" /tmp/iouring-pkg.log || true)
          passed=$(grep -cE "^--- PASS: (${required}) \(" /tmp/iouring-pkg.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP: ' /tmp/iouring-pkg.log || true)
          unlisted=$(grep -E '^[[:space:]]*--- SKIP: ' /tmp/iouring-pkg.log | grep -cvE "^--- SKIP: (${allowed}) \(" || true)
          echo "engine/iouring: SKIP lines $skipped, not enforced by another step $unlisted; celeris#639 tests want $want, ran $ran, passed $passed"
          if [ "$unlisted" -ne 0 ] || [ "$ran" -ne "$want" ] || [ "$passed" -ne "$want" ]; then
            grep -E '^[[:space:]]*--- SKIP: ' /tmp/iouring-pkg.log | grep -vE "^--- SKIP: (${allowed}) \(" || true
            echo "expected no SKIP line other than the five that other steps enforce (listed above if any),"
            echo "and the two celeris#639 tests to run and PASS -- did a test skip here, or was one renamed,"
            echo "removed or failed?"
            exit 1
          fi
      # celeris#543: a transplant's carried bytes (Carryover.Buffered) must be
      # replayed by the adopting engine as if it had read them itself, so under
      # AsyncHandlers an async route's handler runs on the conn's dispatch
      # goroutine. Before the fix the io_uring adopt ran every carried request
      # inline on its worker and the epoll adopt dropped them. The step above
      # runs the io_uring tests without a name check and the root step runs
      # the epoll ones without -v, so all of them run here by name: the engine
      # tests at the runner's memlock (one io_uring worker), with
      # CELERIS_REQUIRE_IOURING_WORKERS=1, and the adaptive one, which forces a
      # switch each way and so builds a second engine's rings within the
      # kernel's uncharge latency, with memlock raised, as job `adaptive` runs
      # its package. Every test must PASS with no SKIP line; each of the six
      # scenario arms must print one RESULT line reading carried_started=true,
      # every other adopted conn served, carried_answered=true, block_runs=1
      # and follow_up=true, and each of the four pipelined arms its answers in
      # order.
      - name: celeris#543 carried bytes replayed under AsyncHandlers (skipping forbidden)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          failed=0
          uring='TestIouringAdoptCarriedAsyncRoute543|TestIouringAdoptCarriedPartialAsyncRoute543|TestIouringAdoptCarriedPipelinedAsync543|TestIouringAdoptCarriedPipelinedSync543'
          epoll='TestEpollAdoptCarriedAsyncRoute543|TestEpollAdoptCarriedPartialAsyncRoute543|TestEpollAdoptCarriedPipelinedAsync543|TestEpollAdoptCarriedPipelinedSync543'
          adaptive='TestAdaptiveSwitchAdoptsCarriedAsyncRequest543'
          go test -race -count=1 -timeout=300s -v -run "^(${uring})\$" ./engine/iouring/ 2>&1 | tee /tmp/c543.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run "^(${epoll})\$" ./engine/epoll/ 2>&1 | tee -a /tmp/c543.log || failed=$((failed + 1))
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          echo "memlock (KiB): $(ulimit -l)"
          go test -race -count=1 -timeout=300s -v -run "^(${adaptive})\$" ./adaptive/ 2>&1 | tee -a /tmp/c543.log || failed=$((failed + 1))
          names="${uring}|${epoll}|${adaptive}"
          want=$(( $(tr '|' '\n' <<<"$names" | wc -l) ))
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/c543.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/c543.log || true)
          results=$(grep -cE 'celeris543 RESULT engine=' /tmp/c543.log || true)
          clean=$(grep -cE 'celeris543 RESULT engine=[^ ]+ split=(true|false) workers=([0-9]+) carried_started=true others_served=\2/\2 carried_answered=true block_runs=1 follow_up=true$' /tmp/c543.log || true)
          ordered=$(grep -cE 'celeris543 PIPELINED engine=[^ ]+ answers=\["/first" "blocked-done" "/third"\] follow_up=true block_runs=1$' /tmp/c543.log || true)
          echo "celeris#543 tests: want $want PASS, passed $passed, SKIP lines $skipped, RESULT lines $results (want 6), clean $clean, pipelined in order $ordered (want 4), go test runs failed $failed (want 0)"
          if [ "$passed" -ne "$want" ] || [ "$skipped" -ne 0 ] || [ "$results" -ne 6 ] || [ "$clean" -ne 6 ] || [ "$ordered" -ne 4 ] || [ "$failed" -ne 0 ]; then
            echo "expected all $want celeris#543 tests to PASS with no SKIP line, six clean RESULT lines and"
            echo "four pipelined arms answered in order -- was one renamed or removed, did one skip or fail?"
            exit 1
          fi
      # celeris#657: the root step ran ./engine/iouring WITHOUT -v, so a skip
      # there printed nothing and the package still reported `ok`. That is how
      # the celeris#656 leak shipped with no cover. The step above now runs
      # the package with -v and every skip accounted for; this one adds what
      # it cannot: the environment variable that turns these tests'
      # environment skips into failures, and the worker-count census. Most
      # celeris#657 tests can skip:
      # they build a ring through newTestRing, build io_uring workers, or start
      # a whole io_uring engine. That holds for the eleven hand-off loss witness
      # tests (PR-1, the first list), the eighteen fd-lifetime tests (PR-2,
      # the second list; eight of them pin the async-cancel-flags probe, the
      # reap-failure and dup-failure paths and the reaped recv's cleanup), the
      # six post-switch sweep tests (PR-3, the third list: the wake poll,
      # the sweep reaching an idle conn through the reap, and the four cases in
      # which it must NOT ask -- no cancel flags, work already owed, a claim
      # already made, a detached WebSocket conn) and the five the PR-3 review
      # added (the fourth list: a connection that joins a cycle past the
      # cursor, the bound on what the rule that catches it may cost, the
      # classifier's lock, a connection that has sent no byte, and the
      # retraction of the residual gauges), plus the celeris#711 pair (a
      # worker that parks holding nothing retracts what it published, whether
      # its last connection left after sweep() or before it). So all
      # forty-two run again here by name, with the PASS-count interlock the
      # `iouring` job uses
      # (celeris#664): -v, CELERIS_REQUIRE_IOURING_WORKERS=1 to turn every
      # environment skip into a failure, and an exact tally.
      #
      # The tally counts TOP-LEVEL results: `=== RUN   Name` with nothing after
      # the name, and `--- PASS: Name (`. go test prints the elapsed time after
      # the name, so the PASS pattern must not end at the name. The step also
      # fails on ANY `--- SKIP` line. The expected count comes from the name
      # list. memlock stays at the runner's 8 MiB, the shape the step above
      # runs these tests in. TestWorkersShareTheHandoffLossWitnesses builds
      # TWO workers through createWorkers, which skips the 12 MiB-per-worker
      # ceiling the Listen path applies; that the pair fits in 8 MiB is
      # measured (CI and local runner-shape containers), not guaranteed. If a
      # later change makes them not fit, the require-workers env turns the
      # ENOMEM into a red job instead of a skip. That is intended.
      #
      # It runs even when a step above failed: the engine/iouring step above
      # can go red on a pre-existing flake (celeris#691), and that must not
      # hide whether these tests pass.
      #
      # That 8 MiB is also what makes this the one-worker leg of the
      # fd-lifetime tests: through the Listen path it funds a single io_uring
      # worker, the shape in which every hand-off loss was measured (all
      # connections on one ring). Each engine-level fd-lifetime test logs
      # "celeris657 engine workers=N"; the step requires at least one such
      # line and every one to read workers=1, so a runner that funds more
      # workers fails here instead of silently testing another shape.
      - name: celeris#657 hand-off witness, fd-lifetime and sweep tests, one io_uring worker (skipping forbidden)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          pr1='TestStaleRecvDataCountsATransplantedConn|TestStaleRecvDataCountsAnAsyncTransplantedConn|TestStaleRecvDataCountsAClosedConn|TestStaleRecvDataCountsAnUnattributedIdentity|TestStaleRecvDataIgnoresCompletionsWithoutData|TestStaleRecvDataCountsEachMultishotCompletion|TestTransplantHandoffInFlightCountsTryTransplant|TestTransplantHandoffInFlightCountsFinishAsyncTransplant|TestMetricsCarriesTheHandoffLossWitnesses|TestWorkersShareTheHandoffLossWitnesses|TestClosedOpsEntryStaysThirtyTwoBytes'
          pr2='TestTransplantNeverHandsOffArmedRecv|TestTransplantReapMissIsRetried|TestHoldReleasedWhenDrainStops|TestHoldRescuedByCheckTimeouts|TestOneOwnerPerHandoff|TestNoDrainSQESequenceIsUnchanged|TestHandoffHasNothingInFlight|TestStaleRecvDataCounted|TestHeldRecvIsReArmedWhenTheHandOffDoesNotHappen|TestWorkerParksWithNothingPending|TestTransplantReapFailureIsNotRetried|TestNoReapWithoutAsyncCancelFlags|TestReapSuppressedAfterFailedHandOff|TestReapedRecvLeavesNoLinkOrBuffer|TestAsyncCancelProbeClassifies|TestAsyncCancelProbeOnThisKernel|TestWorkersCarryTheAsyncCancelProbe|TestReapOnTheRunningKernel'
          pr3='TestWorkerAskWakesTheRing|TestQuiesceMovesAnIdleConn|TestSweepDoesNotSpinWithoutCancelFlags|TestSweepSkipsAConnWithWorkAlreadyOwed|TestSweepDoesNotReClaimAnAsyncHandoff|TestSweepLeavesADetachedConnAlone'
          pr3r2='TestSweepCannotGoDormantWithAnUnexaminedArrival|TestSweepCostIsBoundedUnderContinuousArrivals|TestSweepClassifiesUnderTheLockTheEngineRequires|TestSweepGoesDormantOnAConnThatHasSentNothing|TestResidualGaugeRetractsWhatTheWorkerNoLongerHolds'
          c711='TestParkedWorkerRetractsResidueOfAPostSweepClose|TestParkedWorkerRetractsResidueOfAPreSweepClose'
          names="${pr1}|${pr2}|${pr3}|${pr3r2}|${c711}"
          want=$(( $(tr '|' '\n' <<<"$names" | wc -l) ))
          go test -race -count=1 -timeout=300s -v -run "^(${names})\$" \
            ./engine/iouring/ 2>&1 | tee /tmp/witness657.log
          ran=$(grep -cE "^=== RUN   (${names})\$" /tmp/witness657.log || true)
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/witness657.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/witness657.log || true)
          engines=$(grep -cE 'celeris657 engine workers=[0-9]+$' /tmp/witness657.log || true)
          one=$(grep -cE 'celeris657 engine workers=1$' /tmp/witness657.log || true)
          echo "celeris#657 witness and fd-lifetime tests: want $want, ran $ran, passed $passed, SKIP lines $skipped, engines $engines at workers=1: $one"
          if [ "$ran" -ne "$want" ] || [ "$passed" -ne "$want" ] || [ "$skipped" -ne 0 ] || [ "$engines" -eq 0 ] || [ "$one" -ne "$engines" ]; then
            echo "expected exactly $want top-level celeris#657 tests to run and PASS with no SKIP line, and"
            echo "every engine at one io_uring worker -- was one renamed or removed, did one skip or fail,"
            echo "or did this runner fund a different worker count?"
            exit 1
          fi
      # celeris#657 PR-3: the same silent-exclusion shape, one package over.
      # ./engine/epoll is reached only by the root step above, which runs
      # without -v, so a skip there prints nothing and the package still
      # reports `ok`. Two of the post-switch sweep tests start a REAL
      # epoll engine and t.Skip when it does not come up
      # (sweep_engine_test.go), and they are the two that prove face 1 on a
      # real engine: an idle keep-alive is handed over although its client
      # never sends another byte. A rename or an environment skip would take
      # them out of CI with no red.
      #
      # Nineteen names, in three lists: r1 is the eight this PR first shipped,
      # r2 the nine the review added (sweep_r2_test.go -- the cycle rule and
      # its cost bound, the classifier's lock under -race, the ask's
      # permanent-class pre-check, the release belt over the batch being
      # drained, the pending count, the two gauge retractions and the
      # connection that has sent no byte), and c711 the celeris#711 pair (a
      # loop that parks holding nothing retracts what it published; each
      # starts a real two-loop engine). All nineteen run here by name with
      # the interlock the step above uses: -v, exact top-level RUN and PASS
      # counts, and no `--- SKIP` line anywhere. Two further censuses make the engine cells impossible to
      # lose quietly. Both build their engine with Resources.Workers=2, so
      # every "epoll engine listening" line must read loops=2 -- a runner that
      # resolves a different loop count fails here instead of silently testing
      # another shape. And each prints one SWEEPIDLE line, after the engine
      # bound and after its premise held, so requiring exactly two of them is
      # what says both cells really reached a running engine.
      #
      # No memlock is raised and none is needed: epoll does not allocate
      # locked ring memory, so this step is the same shape on any runner.
      # It runs even when the io_uring step above failed -- the two share no
      # engine, and a known flake there must not hide this one's result.
      - name: celeris#657 epoll post-switch sweep tests (skipping forbidden)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          r1='TestSweepMovesIdleConnsWithoutTraffic|TestSweepMovesIdleAsyncConnsWithoutTraffic|TestSweepStopsWithTheDrain|TestSweepGoesDormantOnPermanentResidue|TestSweepBudgetCoversEveryConnAcrossPasses|TestSweepCadenceBacksOffAndResets|TestAskNeverOutlivesConnState|TestSweepDoesNotBlockOnADetachedConnsLock'
          r2='TestSweepCannotGoDormantWithAnUnexaminedArrival|TestSweepCostIsBoundedUnderContinuousArrivals|TestSweepClassifiesUnderTheLockTheEngineRequires|TestParkAskSkipsWhatTheHandoffCannotAccept|TestDropAskWithdrawsFromTheBatchBeingDrained|TestAskPendingCountsTheQueue|TestResidualGaugeRetractsWhatTheLoopNoLongerHolds|TestResidualGaugeRetractsAtShutdown|TestSweepGoesDormantOnAConnThatHasSentNothing'
          c711='TestParkedLoopRetractsResidueOfAPostSweepClose|TestParkedLoopRetractsResidueOfAPreSweepClose'
          names="${r1}|${r2}|${c711}"
          want=$(( $(tr '|' '\n' <<<"$names" | wc -l) ))
          go test -race -count=1 -timeout=300s -v -run "^(${names})\$" \
            ./engine/epoll/ 2>&1 | tee /tmp/sweep657.log
          ran=$(grep -cE "^=== RUN   (${names})\$" /tmp/sweep657.log || true)
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/sweep657.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/sweep657.log || true)
          engines=$(grep -cE 'epoll engine listening .*loops=[0-9]+' /tmp/sweep657.log || true)
          two=$(grep -cE 'epoll engine listening .*loops=2( |$)' /tmp/sweep657.log || true)
          idle=$(grep -cE 'celeris657 SWEEPIDLE async=(true|false) adopted=' /tmp/sweep657.log || true)
          echo "celeris#657 epoll sweep tests: want $want, ran $ran, passed $passed, SKIP lines $skipped, epoll engines $engines at loops=2: $two, SWEEPIDLE lines $idle (want 2)"
          if [ "$ran" -ne "$want" ] || [ "$passed" -ne "$want" ] || [ "$skipped" -ne 0 ] || [ "$engines" -eq 0 ] || [ "$two" -ne "$engines" ] || [ "$idle" -ne 2 ]; then
            echo "expected exactly $want top-level celeris#657 epoll sweep tests to run and PASS with no SKIP"
            echo "line, every epoll engine at two loops, and both idle-sweep cells to reach their SWEEPIDLE"
            echo "line -- was one renamed or removed, did one skip or fail, or did this runner resolve a"
            echo "different loop count?"
            exit 1
          fi
      # celeris#662 / celeris#675: the root step runs ./engine/epoll WITHOUT
      # -v, so a skip there prints nothing and the package still reports
      # `ok`. That is exactly how the celeris#656 leak shipped with no cover.
      # ./engine/iouring runs with -v in its own step, at 8 MiB; these need
      # memlock raised. These are the celeris#662 tests -- the linger
      # (T1-T3, T5, T6), its negative controls (N1, N2), the io_uring accept
      # re-arm during a linger (T7 and its unit twin), and the
      # DisableDeferAccept arm with its premise and socket checks -- so they
      # get a PASS-count interlock: -v, skipping forbidden, and a tally that
      # fails the step if a test is renamed, removed or skipped.
      #
      # TestLingerArrivalsReachTheIncomingEngine is in the list because it is
      # the one place the celeris#662 linger and the celeris#657 post-switch
      # sweep are tested TOGETHER: during the linger the engine a switch is
      # leaving keeps accepting, and every connection it takes then has to
      # reach the incoming engine, and reach it before the first outgoing
      # listener closes. Its three controls all lose -- the linger at 0
      # admits nothing, the sweep and the park-boundary ask removed leaves
      # 12 of 12 (epoll) and 6 of 12 (io_uring) behind, and a sweep that
      # does nothing while its loop or worker lingers places them only after
      # the close.
      #
      # The tally counts TOP-LEVEL results (`--- PASS: Name (`, and
      # `=== RUN   Name` with nothing after the name), and the step also
      # fails on ANY `--- SKIP` line at any indentation: a subtest that skips
      # still lets its parent report PASS.
      #
      # memlock is raised because the io_uring half needs a worker, and the
      # REQUIRE variables turn every environment skip into a failure. The
      # list also holds the PauseAccept wait's wakeup test: a standalone
      # PauseAccept blocks on the engine's notification through the linger
      # instead of polling every millisecond.
      #
      # It runs even when a step above failed, like the two before it: a
      # red engine/iouring step (celeris#691, pre-existing) must not hide
      # whether the celeris#662 tests pass.
      - name: celeris#662 pause linger tests (skipping forbidden)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
          CELERIS_REQUIRE_LINGER_PREMISES: "1"
        run: |
          set -o pipefail
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          echo "memlock (KiB): $(ulimit -l)"
          both='TestPauseAcceptServesDeferredIdleConnections|TestPauseAcceptServesArrivalsDuringLinger|TestPauseAcceptLingerAnchoredAtClear|TestResumeDuringLingerRestoresDeferAccept|TestShutdownDuringLingerIsPrompt|TestPauseAcceptNoLingerResetsDeferredIdleConnections|TestPauseAcceptNoClearLosesArrivals|TestPauseAcceptKeepsHandshakedIdleConnections|TestPauseAcceptDeferredIdleConnectionsAreHidden|TestPauseAcceptIdleControl|TestListenSocketDeferAcceptFollowsConfig|TestLingerArrivalsReachTheIncomingEngine|TestPauseAcceptWaitIsWoken'
          iouringonly='TestAcceptRearmedDuringLinger|TestAcceptRearmRetriedAfterSQFull'
          names="${both}|${iouringonly}"
          want=$(( 2 * $(tr '|' '\n' <<<"$both" | wc -l) + $(tr '|' '\n' <<<"$iouringonly" | wc -l) ))
          go test -race -count=1 -timeout=600s -v -run "^(${names})\$" \
            ./engine/epoll/ ./engine/iouring/ 2>&1 | tee /tmp/linger662.log
          ran=$(grep -cE "^=== RUN   (${names})\$" /tmp/linger662.log || true)
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/linger662.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/linger662.log || true)
          echo "celeris#662 tests: want $want, ran $ran, passed $passed, SKIP lines $skipped"
          if [ "$ran" -ne "$want" ] || [ "$passed" -ne "$want" ] || [ "$skipped" -ne 0 ]; then
            echo "expected exactly $want top-level celeris#662 tests to run and PASS with no SKIP line --"
            echo "was one renamed or removed, did one (or one of its subtests) skip, or did one fail?"
            exit 1
          fi
      # celeris#662: at net.ipv4.tcp_synack_retries=0, clearing
      # TCP_DEFER_ACCEPT on a pausing listener would make the kernel drop
      # every connection it had deferred at its first timer, so the pause
      # also sets TCP_SYNCNT=1 there. T4 proves the guard serves them and N3
      # proves the loss without it. Both skip at any other value, so this
      # step sets the sysctl (restored on exit) and forbids the skip. It runs
      # even when a step above failed: the engine/iouring step's allow-list
      # leaves these two to this step.
      - name: celeris#662 tcp_synack_retries=0 guard (skipping forbidden)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
          CELERIS_REQUIRE_LINGER_PREMISES: "1"
          CELERIS_REQUIRE_SYNACK0: "1"
        run: |
          set -o pipefail
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          old=$(sysctl -n net.ipv4.tcp_synack_retries)
          restore() { sudo sysctl -w "net.ipv4.tcp_synack_retries=${old}"; }
          trap restore EXIT
          sudo sysctl -w net.ipv4.tcp_synack_retries=0
          names='TestPauseAcceptServesDeferredIdleConnectionsSynackRetriesZero|TestPauseAcceptNoGuardLosesAtSynackRetriesZero'
          want=$(( 2 * $(tr '|' '\n' <<<"$names" | wc -l) ))
          go test -race -count=1 -timeout=300s -v -run "^(${names})\$" \
            ./engine/epoll/ ./engine/iouring/ 2>&1 | tee /tmp/synack662.log
          ran=$(grep -cE "^=== RUN   (${names})\$" /tmp/synack662.log || true)
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/synack662.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/synack662.log || true)
          echo "celeris#662 synack=0 tests: want $want, ran $ran, passed $passed, SKIP lines $skipped"
          if [ "$ran" -ne "$want" ] || [ "$passed" -ne "$want" ] || [ "$skipped" -ne 0 ]; then
            echo "expected exactly $want synack=0 tests to run and PASS with no SKIP line"
            exit 1
          fi
      # celeris#731: the session IDs the session middleware keeps past a
      # request (the key the write-behind worker writes under, the Session a
      # detached stream keeps through the Context, a Session returned by
      # Handler.GetByID) must survive the engine receiving the connection's
      # next bytes into the buffer the ID was read from. The root race step runs
      # ./middleware/session without -v, and a test whose io_uring probe
      # finds no ring (another package's rings are charged to the same
      # 8 MiB) drops its io_uring arms without a word there. So the three
      # tests run again here by name, with CELERIS_REQUIRE_IOURING_WORKERS=1
      # turning a missing io_uring arm into a failure, and an exact tally:
      # 3 top-level PASS and 15 arm PASS (6 of them io_uring), no SKIP line,
      # and go test must exit 0. It runs even when a step above failed.
      - name: celeris#731 session IDs kept past the request (io_uring arms required)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          failed=0
          tests='TestWriteBehindWritesUnderTheRequestsOwnSessionID|TestDetachedStreamKeepsTheLoadedSessionID|TestGetByIDSessionKeepsItsID'
          go test -race -count=1 -timeout=300s -v -run "^(${tests})\$" ./middleware/session/ 2>&1 | tee /tmp/c731.log || failed=1
          top=$(grep -cE "^--- PASS: (${tests}) \(" /tmp/c731.log || true)
          arms=$(grep -cE "^    --- PASS: (${tests})/" /tmp/c731.log || true)
          uring=$(grep -cE "^    --- PASS: (${tests})/io_uring" /tmp/c731.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/c731.log || true)
          echo "celeris#731 tests: top-level PASS $top (want 3), arm PASS $arms (want 15), io_uring arm PASS $uring (want 6), SKIP lines $skipped, go test failed $failed (want 0)"
          if [ "$top" -ne 3 ] || [ "$arms" -ne 15 ] || [ "$uring" -ne 6 ] || [ "$skipped" -ne 0 ] || [ "$failed" -ne 0 ]; then
            echo "expected all three tests and all 15 arms (6 of them io_uring) to PASS with no SKIP line"
            exit 1
          fi
      # celeris#719: an in-memory store (store.MemoryKV, cache.MemoryStore)
      # and the ratelimit dynamic-limiter map keep their own copy of a key
      # whose bytes the caller changes later: a retried Idempotency-Key
      # replays, a cache key from c.Path() still hits, a rate string from a
      # header still finds its limiter. The engine tests run by name with
      # CELERIS_REQUIRE_IOURING_WORKERS=1 and an exact tally: the five
      # top-level tests PASS, the three engine tests' 21 arms (std, and
      # epoll, io_uring and Adaptive with sync and async handlers; 6 of them
      # io_uring and 6 Adaptive) PASS, no SKIP line, and every go test exits 0.
      - name: celeris#719 in-memory store and limiter keys kept as copies (io_uring arms required)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          : > /tmp/c719.log
          failed=0
          go test -race -count=1 -timeout=300s -v -run '^TestMemoryKVKeepsItsOwnKeys$' ./middleware/store/ 2>&1 | tee -a /tmp/c719.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run '^(TestMemoryStoreKeepsItsOwnKeys|TestCustomKeyStillHitsAfterNextRequest)$' ./middleware/cache/ 2>&1 | tee -a /tmp/c719.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run '^TestRetriedIdempotencyKeyReplays$' ./middleware/idempotency/ 2>&1 | tee -a /tmp/c719.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run '^TestDynamicLimiterFoundAfterNextRequest$' ./middleware/ratelimit/ 2>&1 | tee -a /tmp/c719.log || failed=$((failed + 1))
          tests='TestMemoryKVKeepsItsOwnKeys|TestMemoryStoreKeepsItsOwnKeys|TestCustomKeyStillHitsAfterNextRequest|TestRetriedIdempotencyKeyReplays|TestDynamicLimiterFoundAfterNextRequest'
          engine='TestCustomKeyStillHitsAfterNextRequest|TestRetriedIdempotencyKeyReplays|TestDynamicLimiterFoundAfterNextRequest'
          top=$(grep -cE "^--- PASS: (${tests}) \(" /tmp/c719.log || true)
          arms=$(grep -cE "^    --- PASS: (${engine})/" /tmp/c719.log || true)
          uring=$(grep -cE "^    --- PASS: (${engine})/io_uring" /tmp/c719.log || true)
          adaptive=$(grep -cE "^    --- PASS: (${engine})/adaptive" /tmp/c719.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/c719.log || true)
          echo "celeris#719 tests: top-level PASS $top (want 5), engine arm PASS $arms (want 21), io_uring $uring (want 6), adaptive $adaptive (want 6), SKIP lines $skipped, go test runs failed $failed (want 0)"
          if [ "$top" -ne 5 ] || [ "$arms" -ne 21 ] || [ "$uring" -ne 6 ] || [ "$adaptive" -ne 6 ] || [ "$skipped" -ne 0 ] || [ "$failed" -ne 0 ]; then
            echo "expected all five tests and the 21 engine arms (6 io_uring, 6 Adaptive) to PASS with no SKIP line"
            exit 1
          fi
      - name: middleware/compress
        run: go test -race -count=1 -timeout=120s ./...
        working-directory: middleware/compress
      - name: middleware/metrics
        run: go test -race -count=1 -timeout=120s ./...
        working-directory: middleware/metrics
      - name: middleware/otel
        run: go test -race -count=1 -timeout=120s ./...
        working-directory: middleware/otel
      # celeris#720, #732: Adapt must hand net/http the request headers, and
      # Adapt, adapters.WrapMiddleware and the metrics, otel and logger
      # middleware must hand net/http, Prometheus, the OTel SDK and slog
      # copies of the request strings those keep, not views of the
      # connection's receive buffer. The steps above run these packages, but
      # without -v, and each of these tests drops its io_uring arms without a
      # word when the probe finds no ring, which happens while another test
      # binary's rings are still being freed. So they run here by name, one
      # package at a time, with CELERIS_REQUIRE_IOURING_WORKERS=1 turning a
      # missing io_uring arm into a failure, and an exact tally: the seven
      # top-level tests and all 35 arms (std, and epoll and io_uring with sync
      # and async handlers; 14 of them io_uring) must PASS, with no SKIP line,
      # and every go test must exit 0. A failing test does not stop the step
      # early, and the step runs even when a step above failed.
      - name: celeris#720, #732 request strings handed to net/http, Prometheus, OTel, slog (io_uring arms required)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          : > /tmp/c732.log
          failed=0
          go test -race -count=1 -timeout=300s -v -run '^(TestAdaptRequestCarriesHeaders|TestAdaptKeptRequestStringsSurviveNextRequest)$' . 2>&1 | tee -a /tmp/c732.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run '^TestWrapMiddlewareKeptStringsSurviveNextRequest$' ./middleware/adapters/ 2>&1 | tee -a /tmp/c732.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run '^TestKeptRecordSurvivesNextRequest$' ./middleware/logger/ 2>&1 | tee -a /tmp/c732.log || failed=$((failed + 1))
          (cd middleware/metrics && go test -race -count=1 -timeout=300s -v -run '^(TestLabelValuesSurviveNextRequest|TestLabelValuesSurviveConnectionReuse)$' .) 2>&1 | tee -a /tmp/c732.log || failed=$((failed + 1))
          (cd middleware/otel && go test -race -count=1 -timeout=300s -v -run '^TestAttributesSurviveNextRequest$' .) 2>&1 | tee -a /tmp/c732.log || failed=$((failed + 1))
          tests='TestAdaptRequestCarriesHeaders|TestAdaptKeptRequestStringsSurviveNextRequest|TestWrapMiddlewareKeptStringsSurviveNextRequest|TestKeptRecordSurvivesNextRequest|TestLabelValuesSurviveNextRequest|TestLabelValuesSurviveConnectionReuse|TestAttributesSurviveNextRequest'
          top=$(grep -cE "^--- PASS: (${tests}) \(" /tmp/c732.log || true)
          arms=$(grep -cE "^    --- PASS: (${tests})/" /tmp/c732.log || true)
          uring=$(grep -cE "^    --- PASS: (${tests})/io_uring" /tmp/c732.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/c732.log || true)
          echo "celeris#720/#732 tests: top-level PASS $top (want 7), arm PASS $arms (want 35), io_uring arm PASS $uring (want 14), SKIP lines $skipped, go test runs failed $failed (want 0)"
          if [ "$top" -ne 7 ] || [ "$arms" -ne 35 ] || [ "$uring" -ne 14 ] || [ "$skipped" -ne 0 ] || [ "$failed" -ne 0 ]; then
            echo "expected all seven tests and all 35 arms (14 of them io_uring) to PASS with no SKIP line"
            exit 1
          fi
      # celeris#742, the rest of #732: the server's own panic log and the
      # recovery middleware hand slog copies of the method, path, request ID
      # and panic value; otel copies the strings nested in SLICE and MAP
      # custom attributes and the attribute keys; singleflight waiters get
      # copies of the leader's response headers; and request_size_bytes keeps
      # owned label values. And the handler's error: the span records a copy
      # of its message, and singleflight waiters and cache followers get the
      # leader's error and panic value handed off. And what outlives a
      # request in two more places: a BindError's Value, and the SSE event a
      # handler sends to a connected Client (the queued event and the ring
      # replay store's entry). Same shape as the step above: by name, one
      # package at a time, CELERIS_REQUIRE_IOURING_WORKERS=1, and an exact
      # tally: the ten top-level tests and all 105 arms (std, and epoll,
      # io_uring and Adaptive with sync and async handlers, per mode; 30 of
      # them io_uring and 30 Adaptive) must PASS, with no SKIP line, and every
      # go test must exit 0.
      - name: celeris#742 request strings kept by slog, OTel attributes and errors, singleflight waiters, cache followers, BindError, SSE events (io_uring arms required)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          : > /tmp/c742.log
          failed=0
          go test -race -count=1 -timeout=300s -v -run '^(TestHandlerPanicLogSurvivesNextRequest|TestBindErrorValueSurvivesNextRequest)$' . 2>&1 | tee -a /tmp/c742.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run '^TestPanicRecordsSurviveNextRequest$' ./middleware/recovery/ 2>&1 | tee -a /tmp/c742.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run '^TestSentEventSurvivesSendersNextRequest$' ./middleware/sse/ 2>&1 | tee -a /tmp/c742.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run '^(TestWaiterResponseHeadersSurviveLeaderNextRequest|TestWaiterErrorAndPanicSurviveLeaderNextRequest)$' ./middleware/singleflight/ 2>&1 | tee -a /tmp/c742.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run '^TestFollowerErrorSurvivesLeaderNextRequest$' ./middleware/cache/ 2>&1 | tee -a /tmp/c742.log || failed=$((failed + 1))
          (cd middleware/otel && go test -race -count=1 -timeout=300s -v -run '^(TestCustomSliceMapAttributesSurviveNextRequest|TestHandlerErrorSurvivesNextRequest)$' .) 2>&1 | tee -a /tmp/c742.log || failed=$((failed + 1))
          (cd middleware/metrics && go test -race -count=1 -timeout=300s -v -run '^TestRequestSizeLabelsSurviveNextRequest$' .) 2>&1 | tee -a /tmp/c742.log || failed=$((failed + 1))
          tests='TestHandlerPanicLogSurvivesNextRequest|TestBindErrorValueSurvivesNextRequest|TestPanicRecordsSurviveNextRequest|TestSentEventSurvivesSendersNextRequest|TestWaiterResponseHeadersSurviveLeaderNextRequest|TestWaiterErrorAndPanicSurviveLeaderNextRequest|TestFollowerErrorSurvivesLeaderNextRequest|TestCustomSliceMapAttributesSurviveNextRequest|TestHandlerErrorSurvivesNextRequest|TestRequestSizeLabelsSurviveNextRequest'
          # An arm's name is the engine arm, or "<mode>/<arm>" for the tests
          # that run every arm per mode.
          top=$(grep -cE "^--- PASS: (${tests}) \(" /tmp/c742.log || true)
          arms=$(grep -cE "^    --- PASS: (${tests})/" /tmp/c742.log || true)
          uring=$(grep -cE "^    --- PASS: (${tests})/([a-z-]+/)?io_uring" /tmp/c742.log || true)
          adaptive=$(grep -cE "^    --- PASS: (${tests})/([a-z-]+/)?adaptive" /tmp/c742.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/c742.log || true)
          echo "celeris#742 tests: top-level PASS $top (want 10), arm PASS $arms (want 105), io_uring arm PASS $uring (want 30), adaptive arm PASS $adaptive (want 30), SKIP lines $skipped, go test runs failed $failed (want 0)"
          if [ "$top" -ne 10 ] || [ "$arms" -ne 105 ] || [ "$uring" -ne 30 ] || [ "$adaptive" -ne 30 ] || [ "$skipped" -ne 0 ] || [ "$failed" -ne 0 ]; then
            echo "expected all ten tests and all 105 arms (30 io_uring, 30 Adaptive) to PASS with no SKIP line"
            exit 1
          fi
      - name: middleware/protobuf
        run: go test -race -count=1 -timeout=120s ./...
        working-directory: middleware/protobuf
      # celeris#667 / celeris#672: the chanReader regression tests live in
      # ./middleware/websocket, which the root race job above excludes, and
      # this step used to select only `^TestBackpressure` -- so they ran in NO
      # CI job, and neither did any of the other ~14 chanReader unit tests.
      # Widening the regex to `^(TestBackpressure|TestChanReader)` runs all of
      # them. They are in-process tests over newChanReader -- no sockets, no
      # engine, no io_uring ring -- so unlike the `adaptive` and `iouring` jobs
      # this needs nothing raised and has no environment skip to forbid.
      #
      # celeris#706: the step also runs the tests of the server-start helpers
      # (`^TestStartNativeServer`, `^TestWaitForReady`), which the backpressure
      # tests use, in ./middleware/websocket and in ./middleware/static, which
      # has its own copy of waitForReady: a Start that fails must fail the
      # helper at once with Start's error. They start no engine (the engine
      # type is one no factory knows), so they too have no environment skip.
      #
      # It first compiles the package's tests under the celeris_closeprobe
      # tag, which no other step builds: a helper of that file shared a name
      # with one celeris#671 added, and the tagged build stayed broken
      # unnoticed.
      #
      # `-run` is a regex over test names, so a rename would quietly select
      # nothing and go test would still exit 0 ("no tests to run"). The tally
      # below is the interlock, as in the `iouring` job: exactly these
      # fourteen PASS lines must be reported at the top level -- the two
      # celeris#667 orderings, the celeris#672 stale pause, the pausedMu
      # panic release, SetPauser's ordering with the worker (reported only
      # under -race, which this step runs), the WakeFD lock order
      # (celeris#666), the two celeris#705 late-spill orders, the close that
      # must not overtake chunks appended before it and the spilled chunk
      # that must request the pause (both from the celeris#705 review), the
      # re-check's spill guard (celeris#716), and the celeris#706 start-helper
      # tests, TestWaitForReadyFailsFastOnStartError once per package -- and
      # so must each of the fifteen subtests of the stale pause, the panic
      # release, the lock order, the late spill and the close, so a capacity,
      # a callback site or an interleaving dropped from a sweep turns the step
      # red too.
      # A SKIP cannot satisfy it, because a skipped test prints
      # `--- SKIP`, never `--- PASS`. PASS lines carry the elapsed time after
      # the name, so the pattern ends at ` (`, never at the name.
      #
      # -v is required for the tally: without it `go test` prints no
      # per-test result lines at all. The budget goes to 300s because the
      # step runs two suites with per-test output; the measured wall time
      # of this exact shape is ~50s.
      - name: middleware/websocket — backpressure + chanReader tests
        shell: bash
        env:
          WS484_CONNS: "16"
          WS484_BURSTS: "2"
          WS484_BURST_FRAMES: "1000"
        run: |
          set -o pipefail
          go vet -tags celeris_closeprobe ./middleware/websocket/
          go test -race -count=1 -timeout=300s -v \
            -run '^(TestBackpressure|TestChanReader|TestStartNativeServer|TestWaitForReady)' \
            ./middleware/websocket/... ./middleware/static/ 2>&1 | tee /tmp/ws667.log
          names='TestChanReaderLostResumeConverges|TestChanReaderParkedResumeConverges|TestChanReaderStalePauseConverges|TestChanReaderCallbackPanicReleasesPausedMu|TestChanReaderSetPauserOrderedWithAppend|TestChanReaderWakeFDWritersNeverWaitOnPausedMu|TestChanReaderLateSpillReachesParkedRead|TestChanReaderSpillPublishedAfterDrain|TestChanReaderCloseKeepsChunksAppendedBeforeIt|TestChanReaderPauseRecheckHoldsWhileSpilled|TestChanReaderSpillRequestsPauseBelowHighWater|TestStartNativeServerFailsFastOnStartError|TestWaitForReadyFailsFastOnStartError'
          subs='TestChanReaderStalePauseConverges/cap(1|8|16|256)|TestChanReaderCallbackPanicReleasesPausedMu/(pause-in-requestPause|resume-in-Read|resume-in-stale-recheck)|TestChanReaderWakeFDWritersNeverWaitOnPausedMu/(Close-while-pause-holds-pausedMu|Set-while-resume-holds-pausedMu|Close-queued-behind-in-flight-Signal)|TestChanReaderSpillPublishedAfterDrain/(read-after-publication|closed-before-read|read-waiting-in-window)|TestChanReaderCloseKeepsChunksAppendedBeforeIt/(retried-into-channel|spilled-behind-full-channel)'
          # 13 names; TestWaitForReadyFailsFastOnStartError passes once in
          # each package.
          want=14
          wantsub=15
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/ws667.log || true)
          subpassed=$(grep -cE "^    --- PASS: (${subs}) \(" /tmp/ws667.log || true)
          echo "websocket/static regression tests (celeris#667/#672/#705/#706): want $want, passed $passed; subtests want $wantsub, passed $subpassed"
          if [ "$passed" -ne "$want" ] || [ "$subpassed" -ne "$wantsub" ]; then
            echo "expected exactly $want PASS lines of the websocket and static regression tests and $wantsub of their subtests"
            echo "-- was one renamed or removed, did a sweep lose a case, or did one skip or fail?"
            exit 1
          fi
      # celeris#714, #717, #718: the request values a detached stream keeps
      # (WebSocket Conn.Query, SSE Last-Event-ID, a detached Context, and
      # what requestid and the OTel propagators store in the context the
      # stream keeps) must survive the engine receiving more bytes into the
      # buffer they came from. The root race step above excludes
      # ./middleware/websocket, the middleware/otel step above runs without
      # -v, and every one of these tests would drop its io_uring arms
      # without a word if the probe found no ring, which happens while
      # another test binary's rings are still being freed. So all four run
      # here by name, one package at a time, with
      # CELERIS_REQUIRE_IOURING_WORKERS=1 turning a missing io_uring arm into
      # a failure, and an exact tally: the four top-level tests and all 20
      # arms (8 of them io_uring) must PASS, with no SKIP line, and every go
      # test must exit 0. A failing test does not stop the step early: all
      # four run, so a red step shows every test's arms and the tally. It
      # runs even when a step above failed, so a red root step cannot hide
      # these.
      - name: celeris#714 captured request values (io_uring arms required)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          : > /tmp/c714.log
          failed=0
          go test -race -count=1 -timeout=300s -v -run '^TestConnCapturedRequestValuesSurviveFrames$' ./middleware/websocket/ 2>&1 | tee -a /tmp/c714.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run '^TestClientLastEventIDSurvivesPeerBytes$' ./middleware/sse/ 2>&1 | tee -a /tmp/c714.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run '^TestDetachedContextKeepsRequestValues$' . 2>&1 | tee -a /tmp/c714.log || failed=$((failed + 1))
          (cd middleware/otel && go test -race -count=1 -timeout=300s -v -run '^TestExtractedContextSurvivesPeerBytes$' .) 2>&1 | tee -a /tmp/c714.log || failed=$((failed + 1))
          tests='TestConnCapturedRequestValuesSurviveFrames|TestClientLastEventIDSurvivesPeerBytes|TestDetachedContextKeepsRequestValues|TestExtractedContextSurvivesPeerBytes'
          top=$(grep -cE "^--- PASS: (${tests}) \(" /tmp/c714.log || true)
          arms=$(grep -cE "^    --- PASS: (${tests})/" /tmp/c714.log || true)
          uring=$(grep -cE "^    --- PASS: (${tests})/io_uring" /tmp/c714.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/c714.log || true)
          echo "celeris#714 tests: top-level PASS $top (want 4), arm PASS $arms (want 20), io_uring arm PASS $uring (want 8), SKIP lines $skipped, go test runs failed $failed (want 0)"
          if [ "$top" -ne 4 ] || [ "$arms" -ne 20 ] || [ "$uring" -ne 8 ] || [ "$skipped" -ne 0 ] || [ "$failed" -ne 0 ]; then
            echo "expected all four tests and all 20 arms (8 of them io_uring) to PASS with no SKIP line"
            exit 1
          fi
      # celeris#721: a WebSocket Conn answers Param, IP and RemoteAddr from
      # the upgrade request on every engine (std, and epoll, io_uring and
      # Adaptive with sync and async handlers), and Conn.IP only reads, so the
      # read and write goroutines may both call it under -race. celeris#706: every test helper
      # that starts a server in a goroutine fails at once with Start's error;
      # the helpers' own tests run here too (root, middleware, sse, websocket,
      # epoll), since the root race step excludes ./middleware/websocket.
      # Same shape as the step above: by name, CELERIS_REQUIRE_IOURING_WORKERS=1
      # and CELERIS_REQUIRE_DUALSTACK=1 (the dual-stack arms fail instead of
      # skipping), and an exact tally: nine top-level tests, the 14 arms of the #721 test
      # (7 on a loopback listener and 7 on a dual-stack one; 4 io_uring,
      # 4 Adaptive), no SKIP line, and every go test exits 0.
      - name: celeris#721 WebSocket Conn params and peer address, celeris#706 start helpers (io_uring arms required)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
          CELERIS_REQUIRE_DUALSTACK: "1"
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          : > /tmp/c721.log
          failed=0
          go test -race -count=1 -timeout=300s -v -run '^(TestConnParamsAndPeerAddress|TestConnIPConcurrentCalls|TestPeerAddrParsesEngineForms|TestWaitUpOrStoppedReturnsWhenStartFails)$' ./middleware/websocket/ 2>&1 | tee -a /tmp/c721.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run '^TestWaitUpOrStoppedReturnsWhenStartFails$' ./middleware/sse/ ./engine/epoll/ 2>&1 | tee -a /tmp/c721.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run '^(TestWaitServerStartedFailsFastOnStartError|TestWaitServerStartedExtFailsFastOnStartError)$' . 2>&1 | tee -a /tmp/c721.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run '^TestWaitServerStartedMiddlewareFailsFastOnStartError$' ./middleware/ 2>&1 | tee -a /tmp/c721.log || failed=$((failed + 1))
          tests='TestConnParamsAndPeerAddress|TestConnIPConcurrentCalls|TestPeerAddrParsesEngineForms|TestWaitUpOrStoppedReturnsWhenStartFails|TestWaitServerStartedFailsFastOnStartError|TestWaitServerStartedExtFailsFastOnStartError|TestWaitServerStartedMiddlewareFailsFastOnStartError'
          top=$(grep -cE "^--- PASS: (${tests}) \(" /tmp/c721.log || true)
          arms=$(grep -cE "^    --- PASS: TestConnParamsAndPeerAddress/" /tmp/c721.log || true)
          uring=$(grep -cE "^    --- PASS: TestConnParamsAndPeerAddress/(dual-stack/)?io_uring" /tmp/c721.log || true)
          adaptive=$(grep -cE "^    --- PASS: TestConnParamsAndPeerAddress/(dual-stack/)?adaptive" /tmp/c721.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/c721.log || true)
          echo "celeris#721/#706 tests: top-level PASS $top (want 9), #721 arm PASS $arms (want 14), io_uring $uring (want 4), adaptive $adaptive (want 4), SKIP lines $skipped, go test runs failed $failed (want 0)"
          if [ "$top" -ne 9 ] || [ "$arms" -ne 14 ] || [ "$uring" -ne 4 ] || [ "$adaptive" -ne 4 ] || [ "$skipped" -ne 0 ] || [ "$failed" -ne 0 ]; then
            echo "expected all nine tests and the 14 #721 arms (4 io_uring, 4 Adaptive) to PASS with no SKIP line"
            exit 1
          fi
      # celeris#733: the request strings a hijacking handler keeps must not
      # read another connection's bytes. The root race step above runs
      # without -v, where the io_uring arm of TestHijackKeepsRequestViews
      # drops out, and the multishot test skips, without a word when the
      # probe finds no ring or no multishot receive. So both run here by
      # name with CELERIS_REQUIRE_IOURING_WORKERS=1, and an exact tally: the
      # two top-level tests and the four arms (std, epoll, epoll-async,
      # io_uring) must PASS, with no SKIP line, and go test must exit 0.
      - name: celeris#733 hijacked request strings (io_uring arms required)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          failed=0
          tests='TestHijackKeepsRequestViews|TestHijackCopiesRequestValuesUnderMultishotRecv'
          go test -race -count=1 -timeout=300s -v -run "^(${tests})\$" . 2>&1 | tee /tmp/c733.log || failed=1
          top=$(grep -cE "^--- PASS: (${tests}) \(" /tmp/c733.log || true)
          arms=$(grep -cE "^    --- PASS: TestHijackKeepsRequestViews/" /tmp/c733.log || true)
          uring=$(grep -cE "^    --- PASS: TestHijackKeepsRequestViews/io_uring" /tmp/c733.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/c733.log || true)
          echo "celeris#733 tests: top-level PASS $top (want 2), arm PASS $arms (want 4), io_uring arm PASS $uring (want 1), SKIP lines $skipped, go test failed $failed (want 0)"
          if [ "$top" -ne 2 ] || [ "$arms" -ne 4 ] || [ "$uring" -ne 1 ] || [ "$skipped" -ne 0 ] || [ "$failed" -ne 0 ]; then
            echo "expected both tests and all four arms (one io_uring) to PASS with no SKIP line"
            exit 1
          fi
      # celeris#791: a handler panic, or runtime.Goexit, on an async dispatch
      # goroutine must not take the conn's loop or worker with it. The panic's
      # recover used to leave cs.detachMu locked, and closeConn then waited on
      # it forever; a Goexit left the conn owned by a goroutine that no longer
      # existed. The root race step above runs ./engine/epoll, ./engine/std
      # and the root package without -v, where a test that stops running says
      # nothing, and the engine/iouring step counts no name of these. So the
      # eighteen run here by name, with CELERIS_REQUIRE_IOURING_WORKERS=1 and
      # an exact tally: the panic, Goexit, handler-error (control),
      # Detach-then-panic and Detach-then-Goexit arms of io_uring and epoll
      # (the Detach arms pin that the teardown never releases a lock Detach
      # already released: that would be a fatal "unlock of unlocked mutex"),
      # std's panic and Goexit arms, and the public-API arms (an .Async()
      # route that calls runtime.Goexit, with and without a c.Detach() first,
      # on each engine, and its panic control, which the router answers with
      # a 500) must each PASS and print one RESULT line that reads
      # stopped=true, with no SKIP line. memlock stays at the runner's 8 MiB:
      # one io_uring worker, the shape the defect wedged in. Job `adaptive`
      # runs the adaptive arms, whose adopted-conn arm meets the defect on two
      # io_uring workers.
      - name: celeris#791 handler panic and Goexit on a dispatch goroutine (skipping forbidden)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          failed=0
          uring='TestIouringAsyncHandlerPanicLeavesItsWorkerServing|TestIouringAsyncHandlerGoexitLeavesItsWorkerServing|TestIouringAsyncHandlerErrorLeavesItsWorkerServing|TestIouringAsyncHandlerDetachThenPanicLeavesItsWorkerServing|TestIouringAsyncHandlerDetachThenGoexitLeavesItsWorkerServing'
          epoll='TestEpollAsyncHandlerPanicLeavesItsWorkerServing|TestEpollAsyncHandlerGoexitLeavesItsWorkerServing|TestEpollAsyncHandlerErrorLeavesItsWorkerServing|TestEpollAsyncHandlerDetachThenPanicLeavesItsWorkerServing|TestEpollAsyncHandlerDetachThenGoexitLeavesItsWorkerServing'
          std='TestStdHandlerPanicLeavesTheEngineServing|TestStdHandlerGoexitLeavesTheEngineServing'
          server='TestServerAsyncRouteGoexitOnEpoll|TestServerAsyncRouteGoexitOnIOUring|TestServerAsyncRouteDetachThenGoexitOnEpoll|TestServerAsyncRouteDetachThenGoexitOnIOUring|TestServerAsyncRoutePanicOnEpoll|TestServerAsyncRoutePanicOnIOUring'
          go test -race -count=1 -timeout=300s -v -run "^(${uring})\$" ./engine/iouring/ 2>&1 | tee /tmp/c791.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run "^(${epoll})\$" ./engine/epoll/ 2>&1 | tee -a /tmp/c791.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run "^(${std})\$" ./engine/std/ 2>&1 | tee -a /tmp/c791.log || failed=$((failed + 1))
          go test -race -count=1 -timeout=300s -v -run "^(${server})\$" . 2>&1 | tee -a /tmp/c791.log || failed=$((failed + 1))
          names="${uring}|${epoll}|${std}|${server}"
          want=$(( $(tr '|' '\n' <<<"$names" | wc -l) ))
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/c791.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/c791.log || true)
          results=$(grep -cE 'celeris791 RESULT engine=' /tmp/c791.log || true)
          stopped=$(grep -cE 'celeris791 RESULT engine=.* stopped=true( |$)' /tmp/c791.log || true)
          echo "celeris#791 tests: want $want PASS, passed $passed, SKIP lines $skipped, RESULT lines $results, stopped=true $stopped, go test runs failed $failed (want 0)"
          if [ "$passed" -ne "$want" ] || [ "$skipped" -ne 0 ] || [ "$results" -ne "$want" ] || [ "$stopped" -ne "$want" ] || [ "$failed" -ne 0 ]; then
            echo "expected all $want celeris#791 tests to PASS with no SKIP line, each with one RESULT line"
            echo "reading stopped=true -- was one renamed or removed, did one skip or fail?"
            exit 1
          fi
      # celeris#905: a stopped engine must leave no thread pinned to one CPU.
      # The root step runs the epoll test without -v, where a skip prints
      # nothing, and job `adaptive` and the engine/iouring step above count
      # no test of it by name. So the three tests run here by name: epoll and
      # io_uring at the runner's 8 MiB memlock (one io_uring worker), then
      # adaptive with memlock raised and CELERIS_REQUIRE_UPSWITCH=1, as job
      # `adaptive` runs its package. Each re-runs itself in a process of its
      # own and logs that process's output with a "child| " prefix, so the
      # tally counts this process's lines only: all three must PASS with no
      # SKIP line, and each child must print one RESULT line with threads
      # pinned while its engine ran (some not the main thread), none off the
      # process mask after the stop, and none of the pinned threads but the
      # main thread still alive. How many runs had a loop on the main thread,
      # the only thread the fix's restore matters for, is printed and not
      # enforced.
      - name: celeris#905 stopped engines leave no thread pinned to one CPU (skipping forbidden)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          failed=0
          engines='TestStoppedEngineLeavesNoPinnedThread'
          adaptive='TestStoppedAdaptiveEngineLeavesNoPinnedThread'
          go test -race -count=1 -timeout=300s -v -run "^(${engines})\$" ./engine/epoll/ ./engine/iouring/ 2>&1 | tee /tmp/c905.log || failed=$((failed + 1))
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          echo "memlock (KiB): $(ulimit -l)"
          CELERIS_REQUIRE_UPSWITCH=1 go test -race -count=1 -timeout=300s -v -run "^(${adaptive})\$" ./adaptive/ 2>&1 | tee -a /tmp/c905.log || failed=$((failed + 1))
          passed=$(grep -cE "^--- PASS: (${engines}|${adaptive}) \(" /tmp/c905.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/c905.log || true)
          results=$(grep -cE 'celeris905 RESULT engine=(epoll|io_uring|adaptive) ' /tmp/c905.log || true)
          clean=$(grep -cE 'celeris905 RESULT engine=(epoll|io_uring|adaptive) cycles=[0-9]+ process_mask=[0-9,-]+ pinned_while_running=[1-9][0-9]* main_thread_hosted_a_loop=[0-9]+ off_mask_after_stop=0 locked_probes=[1-9][0-9]* locked_off_mask=0 pinned_not_main=[1-9][0-9]* alive_after_stop=0$' /tmp/c905.log || true)
          m0=$(grep -cE 'celeris905 RESULT .* main_thread_hosted_a_loop=[1-9]' /tmp/c905.log || true)
          echo "celeris#905 tests: want 3 PASS, passed $passed, SKIP lines $skipped, RESULT lines $results, clean $clean (want 3), a loop on the main thread in $m0, go test runs failed $failed (want 0)"
          if [ "$passed" -ne 3 ] || [ "$skipped" -ne 0 ] || [ "$results" -ne 3 ] || [ "$clean" -ne 3 ] || [ "$failed" -ne 0 ]; then
            echo "expected the three celeris#905 tests to PASS with no SKIP line, each child with one RESULT line"
            echo "showing pinned threads while running, none off the mask after the stop, and no pinned thread"
            echo "but the main thread left alive -- was one renamed or removed, did one skip or fail?"
            exit 1
          fi

  adaptive:
    name: Adaptive engine (./adaptive/...)
    runs-on: ubuntu-latest
    # 30, not 20, since celeris#657 PR-3 un-quarantined TestBidirectionalFlapAsync
    # (three promote/revert flaps over 64 loaded keep-alives) into the first step.
    # The two steps' own `go test -timeout` values are 900s and 300s, so the job
    # limit stays above their sum and a hung test is still killed by go test,
    # with its stack, rather than by the runner with nothing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      # celeris#641: the default engine's own package ran in no CI job. It
      # needs two things the unit job does not give it.
      #
      # memlock above io_uring's per-worker ring budget: GitHub-hosted
      # runners default to 8 MiB, where adaptive.New correctly disables the
      # conns-per-worker up-switch, so the five tests whose claim is that
      # switch cannot pass. The step raises its own shell's limit; the test
      # processes inherit it.
      #
      # CELERIS_REQUIRE_UPSWITCH=1 turns those tests' environment skip into
      # a failure, so this job cannot go green by skipping them.
      #
      # Quarantined by name, each with its open issue. Delete the entry when
      # the issue closes: TestRampH1Sync and TestRampH1Async, celeris#708.
      # The other three up-switch tests keep running.
      #
      # The two ramps were quarantined for celeris#657 and celeris#662, both
      # fixed now: with the two fixes together they PASS locally (m128,
      # -race, every high phase at epoll=0 of 2048, no read reset), and on
      # main without the #662 fix they fail with the accept hand-over's read
      # resets. Neither has passed on a GitHub-hosted runner yet, and the
      # repository's lift rule is >= 6 GitHub-hosted runs of identical bytes,
      # all green, which celeris#708 tracks together with the evidence. When
      # they are lifted, their names go into a PASS tally below so they
      # cannot go quiet again.
      #
      # TestBidirectionalFlapAsync was the third entry, quarantined for
      # celeris#657 itself. PR-3 fixes what it was failing on -- at a flap the
      # outgoing engine kept 35-51 of 64 connections on the base and 0 on the
      # fix, 8 of 8 each -- and it is un-skipped here under that lift rule:
      # only after >= 6 GitHub-hosted re-runs of identical bytes all pass.
      # Those re-runs are recorded on the PR. It is in the placement tally
      # below, so it cannot go quiet again.
      #
      # celeris#657 face 2 has its multi-ring gate here: TestFlapConnsPerRing
      # (T4) fixes both engines at two workers, so its 256 keep-alive
      # connections are 128 per io_uring ring whatever the runner funds, and
      # runs three promote/revert cycles under load. At raised memlock the two
      # revert tests below spread their 64 connections over several rings and
      # did not lose on the base; T4 lost requests in 8 of 8 base runs. The
      # tally makes T4 impossible to lose quietly: exactly one top-level RUN
      # and PASS, no SKIP line for it, and its own RESULT line must show both
      # engines at two workers and err=0 (the requests its clients lost).
      #
      # celeris#657 face 1 (PR-3, placement) has its gate here too. Nine cells
      # run in this same invocation: the four idle-keep-alive switch cells,
      # the two polled flaps, the slow async handler, the switch-order cell
      # and the un-quarantined TestBidirectionalFlapAsync. Every one of them
      # t.Skips under -short, and the whole set is what separates the base
      # from the fix, so the same interlock applies: exactly nine top-level
      # RUN and PASS, no `--- SKIP` line naming one of them, and one RESULT
      # line per cell. The eight PR-3 cells report err=0 w1=0 w2=0 on their
      # RESULT line -- no client lost a request, no recv outlived its
      # hand-off, no hand-off was made with an op in flight. The flap's own
      # verdict tolerates up to one lost request per connection, so its total
      # line is required to exist but its error count is not tightened here:
      # the evidence that it is 0 is local (8 of 8), not GitHub-hosted.
      #
      # `shell: bash` runs the step as `bash --noprofile --norc -eo pipefail`,
      # so a `go test` failure on the left of the tee below fails the step
      # instead of being masked by tee's exit status. The explicit
      # `set -o pipefail` keeps that true if the shell line is ever changed.
      #
      # The tally is the interlock. celeris#662's adaptive tests must run
      # here, and celeris#641's whole point is that this job must not go
      # green by skipping: -run/-skip regexes and renames select silently, so
      # the count is asserted rather than assumed. It counts TOP-LEVEL results
      # (`--- PASS: Name (`, and `=== RUN   Name` with nothing after it), and
      # a SKIP line for any of these names, a subtest's included, fails it.
      # (The round-3 version ended its regex in `)$`, which can never match
      # `--- PASS: Name (0.01s)`, so this job could never go green.)
      - name: Adaptive — race tests (memlock raised, up-switch required)
        shell: bash
        env:
          CELERIS_REQUIRE_UPSWITCH: "1"
        run: |
          set -o pipefail
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          echo "memlock (KiB): $(ulimit -l)"
          go test -race -count=1 -timeout=900s -v \
            -skip '^(TestRampH1Sync|TestRampH1Async)$' \
            ./adaptive/... 2>&1 | tee /tmp/adaptive-race.log
          t4='TestFlapConnsPerRing'
          ran=$(grep -cE "^=== RUN   ${t4}\$" /tmp/adaptive-race.log || true)
          passed=$(grep -cE "^--- PASS: ${t4} \(" /tmp/adaptive-race.log || true)
          skipped=$(grep -cE "^[[:space:]]*--- SKIP: ${t4}[ /]" /tmp/adaptive-race.log || true)
          results=$(grep -cE 'S0T4 RESULT cycles=[0-9]+ conns=[0-9]+ wE=[0-9]+ wI=[0-9]+ ' /tmp/adaptive-race.log || true)
          clean=$(grep -cE 'S0T4 RESULT cycles=3 conns=256 wE=2 wI=2 conns_per_ring=128 ok=[0-9]+ err=0 ' /tmp/adaptive-race.log || true)
          echo "celeris#657 T4: want 1, ran $ran, passed $passed, SKIP lines $skipped, RESULT lines $results, at two workers with err=0: $clean"
          if [ "$ran" -ne 1 ] || [ "$passed" -ne 1 ] || [ "$skipped" -ne 0 ] || [ "$results" -ne 1 ] || [ "$clean" -ne 1 ]; then
            echo "expected TestFlapConnsPerRing to run once and PASS with no SKIP line, and its RESULT line to show"
            echo "both engines at two workers (128 connections per io_uring ring) and err=0 -- was it renamed or"
            echo "removed, did it skip, or did this runner fund a different worker count?"
            exit 1
          fi
          place='TestIdleConnsFollowSwitchPromoteSync|TestIdleConnsFollowSwitchPromoteAsync|TestIdleConnsFollowSwitchRevertSync|TestIdleConnsFollowSwitchRevertAsync|TestFlapConvergesPollSync|TestFlapConvergesPollAsync|TestSlowAsyncHandlerConverges|TestSwitchDoesNotAdoptOntoOutgoing|TestBidirectionalFlapAsync'
          pwant=$(( $(tr '|' '\n' <<<"$place" | wc -l) ))
          pran=$(grep -cE "^=== RUN   (${place})\$" /tmp/adaptive-race.log || true)
          ppassed=$(grep -cE "^--- PASS: (${place}) \(" /tmp/adaptive-race.log || true)
          pskipped=$(grep -cE "^[[:space:]]*--- SKIP: (${place})[ /]" /tmp/adaptive-race.log || true)
          presults=$(grep -cE 'celeris657 (IDLE-(promote|revert)|FLAPPOLL) async=(true|false) RESULT |S0SA RESULT |celeris657 B0 fired=|\[async=true\] total ok=[0-9]+ err=[0-9]+ \|' /tmp/adaptive-race.log || true)
          pclean=$(grep -cE 'celeris657 (IDLE-(promote|revert)|FLAPPOLL) async=(true|false) RESULT .* err=0 w1=0 w2=0 |S0SA RESULT .* err=0 census=|celeris657 B0 fired=true |\[async=true\] total ok=[0-9]+ err=[0-9]+ \|' /tmp/adaptive-race.log || true)
          echo "celeris#657 placement: want $pwant, ran $pran, passed $ppassed, SKIP lines $pskipped, RESULT lines $presults, clean $pclean"
          if [ "$pran" -ne "$pwant" ] || [ "$ppassed" -ne "$pwant" ] || [ "$pskipped" -ne 0 ] || [ "$presults" -ne "$pwant" ] || [ "$pclean" -ne "$presults" ]; then
            echo "expected exactly $pwant top-level celeris#657 placement tests to run and PASS with no SKIP line,"
            echo "and one RESULT line each: the eight PR-3 cells reporting err=0 w1=0 w2=0 (no client lost a"
            echo "request, no recv outlived its hand-off, no hand-off was made with an op in flight) and"
            echo "TestBidirectionalFlapAsync reporting its total. Was one renamed or removed, did one skip"
            echo "(-short skips all nine), or did a cell stop reaching its own measurement?"
            exit 1
          fi
          guarded='TestSwitchKeepsHandshakedIdleConnections|TestSwitchKeepsHandshakedIdleConnectionsOnRevert|TestAdaptiveListenersKeepDeferAcceptAcrossSwitches|TestPerformSwitchDoesNotBlockOnLinger|TestFlapWithinLingerKeepsListeners|TestLingerTransplantConserves|TestAdaptiveSwitchVsAcceptChurn|TestAdaptiveSwitchVsAcceptChurnDefaultLinger|TestSwitchAbortedByADriverDrainsTheFreshStandby'
          gwant=$(( $(tr '|' '\n' <<<"$guarded" | wc -l) ))
          gran=$(grep -cE "^=== RUN   (${guarded})\$" /tmp/adaptive-race.log || true)
          gpassed=$(grep -cE "^--- PASS: (${guarded}) \(" /tmp/adaptive-race.log || true)
          gskipped=$(grep -cE "^[[:space:]]*--- SKIP: (${guarded})[ /]" /tmp/adaptive-race.log || true)
          echo "celeris#662 adaptive tests: want $gwant, ran $gran, passed $gpassed, SKIP lines $gskipped"
          if [ "$gran" -ne "$gwant" ] || [ "$gpassed" -ne "$gwant" ] || [ "$gskipped" -ne 0 ]; then
            echo "expected exactly $gwant celeris#662 adaptive tests to run and PASS with no SKIP line --"
            echo "were they renamed or removed, or did one skip? a skip is not coverage."
            exit 1
          fi
      # celeris#791 through the adaptive engine: a handler panic on the start
      # engine's (epoll's) dispatch goroutine, and on a connection the switch
      # handed to io_uring (#383), must leave the worker serving. The step
      # above runs both tests in the package run; this one runs them by name
      # with the same raised memlock (two io_uring workers) and requires both
      # to PASS, each with a RESULT line reading stopped=true, and no SKIP
      # line. CELERIS_REQUIRE_UPSWITCH=1 turns their "io_uring unavailable"
      # skip into a failure.
      - name: celeris#791 adaptive arms (memlock raised, skipping forbidden)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_UPSWITCH: "1"
        run: |
          set -o pipefail
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          echo "memlock (KiB): $(ulimit -l)"
          names='TestAdaptiveAsyncHandlerPanicLeavesTheStartEngineServing|TestAdaptiveAsyncHandlerPanicOnAnAdoptedConnLeavesItsWorkerServing'
          want=$(( $(tr '|' '\n' <<<"$names" | wc -l) ))
          go test -race -count=1 -timeout=300s -v -run "^(${names})\$" \
            ./adaptive/ 2>&1 | tee /tmp/c791a.log
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/c791a.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/c791a.log || true)
          stopped=$(grep -cE 'celeris791 RESULT engine=adaptive shape=(start|adopted) .* stopped=true$' /tmp/c791a.log || true)
          echo "celeris#791 adaptive tests: want $want, passed $passed, SKIP lines $skipped, RESULT lines with stopped=true $stopped"
          if [ "$passed" -ne "$want" ] || [ "$skipped" -ne 0 ] || [ "$stopped" -ne "$want" ]; then
            echo "expected both celeris#791 adaptive tests to PASS with no SKIP line and a stopped=true RESULT line"
            exit 1
          fi
      # celeris#657 PR-2: the one-worker leg of the two revert tests. The step
      # above raises memlock, so io_uring there runs several workers and
      # TestReverseTransplant / TestBidirectionalFlap never meet the shape in
      # which the io_uring -> epoll hand-off lost requests: every connection
      # on ONE io_uring ring. This step does not raise memlock. At the
      # runner's own 8 MiB io_uring is capped to one worker (12 MiB per
      # worker, engine/iouring/ring.go minMemlockPerWorker), and the step
      # requires at least one "io_uring engine listening" line and every one
      # to read workers=1, so a runner that funds more workers fails here
      # instead of silently testing another shape.
      #
      # Neither test reads a CELERIS_REQUIRE_* variable: they t.Skip when
      # io_uring is unavailable. The tally is what forbids that: it fails on
      # ANY `--- SKIP` line, and on any top-level count other than two RUN and
      # two PASS (same patterns as the unit job's celeris#657 step). It runs
      # even when the step above failed, so a known flake there cannot hide
      # this leg's result.
      #
      # Their verdicts tolerate up to one lost request per connection (err <=
      # 64), so a PASS alone does not mean nothing was lost: on the base, the
      # flap test PASSED once with 56 lost requests. The step therefore also
      # reads each test's own summary line (the revert test's "before revert"
      # line and the flap test's "total" line, both for async=false) and
      # requires err=0 on both.
      - name: Adaptive — one-worker revert tests (runner memlock, skipping forbidden)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          names='TestReverseTransplant|TestBidirectionalFlap'
          want=$(( $(tr '|' '\n' <<<"$names" | wc -l) ))
          go test -race -count=1 -timeout=300s -v -run "^(${names})\$" \
            ./adaptive/ 2>&1 | tee /tmp/revert657.log
          ran=$(grep -cE "^=== RUN   (${names})\$" /tmp/revert657.log || true)
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/revert657.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/revert657.log || true)
          engines=$(grep -cE 'io_uring engine listening .*workers=[0-9]+' /tmp/revert657.log || true)
          one=$(grep -cE 'io_uring engine listening .*workers=1( |$)' /tmp/revert657.log || true)
          summaries=$(grep -cE '\[async=false\] (before revert: .*\| ok=[0-9]+ err=[0-9]+$|total ok=[0-9]+ err=[0-9]+ \|)' /tmp/revert657.log || true)
          lossless=$(grep -cE '\[async=false\] (before revert: .*\| ok=[0-9]+ err=0$|total ok=[0-9]+ err=0 \|)' /tmp/revert657.log || true)
          echo "celeris#657 one-worker revert tests: want $want, ran $ran, passed $passed, SKIP lines $skipped, io_uring engines $engines at workers=1: $one, summaries $summaries with err=0: $lossless"
          if [ "$ran" -ne "$want" ] || [ "$passed" -ne "$want" ] || [ "$skipped" -ne 0 ] || [ "$engines" -eq 0 ] || [ "$one" -ne "$engines" ] || [ "$summaries" -ne "$want" ] || [ "$lossless" -ne "$summaries" ]; then
            echo "expected exactly $want top-level revert tests to run and PASS with no SKIP line, every"
            echo "io_uring engine at one worker, and each test's summary line to report err=0 -- was one renamed"
            echo "or removed, did one skip or fail, did this runner fund a different worker count, or were"
            echo "requests lost (a PASS verdict tolerates up to one per connection)?"
            exit 1
          fi
      # celeris#616: New decides the port both sub-engines serve on and holds
      # it until the start engine has bound it in Listen. These tests take the
      # port in that gap with a Go listener and with a bare socket, on each
      # start engine, on 127.0.0.1 and on the default dual-stack wildcard, and
      # beside the TIME_WAIT sockets an ordinary Go server leaves (where only
      # a shared hold can be taken), and need the engine to start on the port
      # anyway, on the address net.Listen gives. The io_uring arms skip when
      # io_uring cannot be built, and the step above runs them without a
      # tally, so here they run by name at the runner's memlock (one io_uring
      # worker) and must all PASS with no SKIP line, each arm printing its
      # own RESULT line, and New must hand the sub-engines net.Listen's
      # address on every free-port form. CELERIS_REQUIRE_DUALSTACK=1 turns the
      # dual-stack tests' skip on a host without IPv6 into a failure.
      - name: celeris#616 port held from New to Listen (skipping forbidden)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_DUALSTACK: "1"
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          names='TestAdaptivePortHeldFromNewToListen616|TestAdaptivePortHeldThroughListenStart616|TestAdaptivePortHoldRefusesDials616|TestAdaptivePortHoldReleasedOnceBound616|TestAdaptiveShutdownWithoutListenFreesPort616|TestAdaptivePortHeldWildcard616|TestAdaptivePortHeldBesideTimeWait616|TestAdaptiveTimeWaitStealFailsLoudly616|TestAdaptiveNoHoldOnlyWhereNetListenFails616|TestAdaptivePortHoldKind616|TestAdaptiveAddrMatchesNetListen616'
          want=$(( $(tr '|' '\n' <<<"$names" | wc -l) ))
          go test -race -count=1 -timeout=300s -v -run "^(${names})\$" \
            ./adaptive/ 2>&1 | tee /tmp/c616.log
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/c616.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/c616.log || true)
          gap=$(grep -cE 'celeris616 result: start=(epoll|iouring) thief=(go-listener|bare-socket) steal_in_gap_refused=true started=true ' /tmp/c616.log || true)
          inlisten=$(grep -cE 'celeris616 in-Listen steal: start=(epoll|iouring) thief=(go-listener|bare-socket) .* steal_err=.*address already in use listen_err=<nil>$' /tmp/c616.log || true)
          wild=$(grep -cE 'celeris616 wildcard: start=(epoll|iouring) addr=\[::\]:[1-9][0-9]* thieves=\[[^]]*\] refused=6/6 started=true v4=200 v6=200$' /tmp/c616.log || true)
          tw=$(grep -cE 'celeris616 time-wait: start=(epoll|iouring) form=[^ ]+ time_wait=[1-9][0-9]* exclusive_refused=true net_listen=([^ ]+) handed=\2 thief=(EADDRINUSE|-) started=true v4=200 v6=(200|0)$' /tmp/c616.log || true)
          twheld=$(grep -cE 'celeris616 time-wait: start=(epoll|iouring) form=(wildcard|0\.0\.0\.0|\[::\]) .* thief=EADDRINUSE started=true v4=200 v6=200$' /tmp/c616.log || true)
          kind=$(grep -cE 'celeris616 hold kind: state=(free-port .* SO_REUSEADDR=0 SO_REUSEPORT=[1-9]|time-wait .* SO_REUSEADDR=[1-9] SO_REUSEPORT=[1-9])$' /tmp/c616.log || true)
          echo "celeris#616 tests: want $want, passed $passed, SKIP lines $skipped, New-to-Listen arms refused and started $gap (want 4), in-Listen arms refused $inlisten (want 4), wildcard arms 6/6 refused and dual-stack $wild (want 2), TIME_WAIT arms on net.Listen's address $tw (want 10) of which wildcard held $twheld (want 6), hold kinds $kind (want 2)"
          if [ "$passed" -ne "$want" ] || [ "$skipped" -ne 0 ] || [ "$gap" -ne 4 ] || [ "$inlisten" -ne 4 ] || [ "$wild" -ne 2 ] || [ "$tw" -ne 10 ] || [ "$twheld" -ne 6 ] || [ "$kind" -ne 2 ]; then
            echo "expected all $want celeris#616 tests to PASS with no SKIP line, and every arm on both start"
            echo "engines to report a refused steal -- was one renamed or removed, or did an io_uring arm skip?"
            exit 1
          fi

  iouring:
    name: io_uring init-failure regression (./engine/iouring)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      # celeris#656: the three tests that pin the failed-worker listen-socket
      # leak ask for TWO io_uring workers on one port, and RLIMIT_MEMLOCK funds
      # one per 12 MiB (engine/iouring/ring.go minMemlockPerWorker). GitHub
      # -hosted runners default to 8 MiB, so in the `unit` job -- which runs
      # ./engine/iouring without raising memlock and without -v -- all three
      # skipped silently and the leak shipped with no CI cover.
      #
      # Same two ingredients as the `adaptive` job (celeris#641): raise memlock
      # for this shell, which the test process inherits, and set
      # CELERIS_REQUIRE_IOURING_WORKERS=1 so every environment skip in
      # init_failure_leak_linux_test.go becomes a failure.
      #
      # Scoped to those tests by -run rather than running the whole package
      # here: the rest of ./engine/iouring keeps running in `unit` at the
      # runner's own memlock, the shape it has been green in.
      #
      # `-run` is a regex over test names, so a rename would quietly select
      # nothing and go test would still exit 0 ("no tests to run"). The tally
      # below is the interlock: exactly three of these tests must report PASS.
      - name: io_uring worker init-failure leak tests (memlock raised, skipping forbidden)
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          echo "memlock (KiB): $(ulimit -l)"
          go test -race -count=1 -timeout=600s -v \
            -run '^TestListenCloses(ListenSocketsWhenEveryWorkerRingSetupFails|ListenSocketWhenOneWorkerRingSetupFails|ListenSocketRingAndEventfdWhenInitialSubmitFails)$' \
            ./engine/iouring/ 2>&1 | tee /tmp/iouring656.log
          passed=$(grep -cE '^--- PASS: TestListenCloses' /tmp/iouring656.log || true)
          echo "celeris#656 tests passed: $passed"
          if [ "$passed" -ne 3 ]; then
            echo "expected 3 celeris#656 tests to PASS, saw $passed -- were they renamed, or did they skip?"
            exit 1
          fi
      # celeris#691: every io_uring driver test, by name, five runs each. The
      # `unit` job runs this package without -v, and startTestEngine skips
      # when the engine does not come up, so a skip there prints nothing. The
      # tally requires every run to PASS and no FAIL or SKIP line: a skipped
      # or renamed test turns this red. Seven of the tests pin the
      # UnregisterConn-then-Close leak and every path that must close the
      # duplicate descriptor its fix takes, two a register on a worker that
      # has shut down, two an SQE prepared by a descriptor number the
      # caller closes before the submit, three a driver cancel that
      # outlived its conn (#707), and three a register the worker applies
      # after the number was closed and taken by an accept. Two more (n735)
      # pin a driver close that lingers: off the worker, and waited for at
      # shutdown (celeris#735).
      # TestDriverHTTPZeroOverhead is where the leak was first seen: 2 of 7
      # full-package runs failed on #674's branch (#691).
      #
      # memlock stays at the runner's 8 MiB, the shape `unit` runs these in.
      # One driver test's engine runs at a time, and it fits in that budget.
      - name: celeris#691 io_uring driver tests (skipping forbidden)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          old='TestDriverRegisterUnregister|TestDriverHTTPZeroOverhead|TestDriverWriteSerialization|TestDriverCancelOnUnregister|TestIouringRegisterConnFDCollision|TestIouringShutdownFiresDriverOnClose|TestDriverUnknownFDReturnsErr|TestShutdownDriversRetainsConnsWithOpsInFlight'
          new='TestDriverUnregisterThenCloseAtOnce|TestDriverUnregisterThenCloseWhileWorkerBusy|TestDriverUnregisterWaitForOnCloseThenClose|TestDriverUnregisterThenCloseNumberReused|TestDriverSendFailureThenUnregisterThenClose|TestDriverRefusedRegisterThenNumberReused|TestDriverCloseBeforeUnregisterSparesReusedNumber|TestDriverUnregisterCyclesReleaseDescriptors|TestDriverShutdownReleasesDescriptors|TestDriverRegisterAfterShutdownIsRefused|TestDriverRegisterRacingShutdownReleasesEverySocket|TestDriverRecvRearmBeforeSubmitSparesReusedNumber|TestDriverSendBeforeSubmitSparesReusedNumber|TestDriverFailureCancelCompletesBeforeRelease|TestDriverFailureCloseCompletionSparesConnOnReusedNumber|TestDriverStrayCloseCompletionSparesConn|TestDriverUnregisterWithSendInFlightThenNumberTakenByHTTP|TestDriverUnregisterQueuedAheadOfRegisterThenNumberTakenByHTTP|TestDriverRefusedRegisterWaitsForItsSend'
          n735='TestDriverLingeringCloseDoesNotStallTheWorker|TestDriverShutdownWaitsForAHandedOffClose'
          names="${old}|${new}|${n735}"
          runs=5
          want=$(( $(tr '|' '\n' <<<"$names" | wc -l) * runs ))
          go test -race -count="$runs" -timeout=600s -v -run "^(${names})\$" \
            ./engine/iouring/ 2>&1 | tee /tmp/driver691.log
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/driver691.log || true)
          failed=$(grep -cE '^[[:space:]]*--- FAIL' /tmp/driver691.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/driver691.log || true)
          echo "celeris#691 driver tests: want $want PASS, passed $passed, FAIL lines $failed, SKIP lines $skipped"
          if [ "$passed" -ne "$want" ] || [ "$failed" -ne 0 ] || [ "$skipped" -ne 0 ]; then
            echo "expected exactly $want driver test runs to PASS with no FAIL or SKIP line --"
            echo "was a test renamed or removed, or did one skip or fail?"
            exit 1
          fi

  zc-window:
    name: io_uring SEND_ZC window under -race, with its detector control (celeris#587, ${{ matrix.os }})
    # Both arches: the detector control must hold on arm64 as on x86.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      # TestSendZCWindowGuardUnderRace holds the SEND_ZC first-CQE -> NOTIF
      # window open (internal/zcwindow.SetHold, -tags=validation only) while
      # the handler pushes 256 x 64 KiB frames at a steady pace to a client
      # that reads four times slower, so the detached handler keeps calling
      # the inline-egress guard through every hold; it requires the guard to
      # decline inside that window at least once, and every byte to arrive
      # intact and in order. Neither the root race step (no validation tag,
      # ./middleware/websocket excluded) nor the websocket step
      # (-run '^TestBackpressure') reaches it.
      #
      # Three arms, each run N=3 times as SEPARATE processes (the race
      # detector reports a given race once per process), each process with
      # its OWN log, and judged PER PROCESS on the "--- PASS:" / "--- FAIL:"
      # lines and the race detector's reports (a SKIP is a failure:
      # CELERIS_REQUIRE_IOURING_WORKERS=1):
      #   1. the tree as committed: every process PASS, no race report;
      #   2. CELERIS_IOURING_SEND_ZC=off: every process PASS with every ZC
      #      witness at 0 (the witnesses track SEND_ZC, not traffic), no race;
      #   3. the MUTANT (.github/scripts/mutant-587-unlock-zc-first-cqe.py
      #      releases detachMu before the writes of handleSend's CQE_F_MORE
      #      branch):
      #      EVERY process FAIL, and every process with its own
      #      "WARNING: DATA RACE" report and "race detected during execution
      #      of test" line. A process that fails for any other reason does
      #      not count as a kill. This is what makes arm 1 evidence: it
      #      proves the race detector watches this path in every run, not
      #      by luck.
      # This job is a CI check on every PR; it becomes a required gate only
      # if the celeris main ruleset lists it.
      # memlock is raised for the same reason as the `iouring` job: io_uring
      # workers need 12 MiB each and the runner defaults to 8 MiB.
      - name: SEND_ZC window test, ZC-off branch control and the detachMu mutant
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          echo "memlock (KiB): $(ulimit -l)"
          run() { # label, then env assignments; N separate processes, one log each
            local label=$1; shift
            local i rc
            for i in 1 2 3; do
              rc=0
              env "$@" go test -tags=validation -race -count=1 -timeout=300s -v \
                -run '^TestSendZCWindowGuardUnderRace$' ./middleware/websocket/ \
                > "/tmp/zc587-$label-$i.log" 2>&1 || rc=$?
              echo "$label run $i rc=$rc"
              grep -E 'ZCWIN|^--- (PASS|FAIL|SKIP): TestSendZCWindowGuardUnderRace' "/tmp/zc587-$label-$i.log" || true
            done
          }
          # tally <label> <want: pass|kill>: every one of the 3 processes must
          # meet the arm's verdict on its own log.
          tally() {
            local label=$1 want=$2 i log p f s r d bad=0
            for i in 1 2 3; do
              log="/tmp/zc587-$label-$i.log"
              p=$(grep -cE '^--- PASS: TestSendZCWindowGuardUnderRace \(' "$log" || true)
              f=$(grep -cE '^--- FAIL: TestSendZCWindowGuardUnderRace \(' "$log" || true)
              s=$(grep -cE '^[[:space:]]*--- SKIP' "$log" || true)
              r=$(grep -c 'WARNING: DATA RACE' "$log" || true)
              d=$(grep -c 'race detected during execution of test' "$log" || true)
              echo "$label run $i: PASS=$p FAIL=$f SKIP=$s DATA_RACE=$r race_detected=$d"
              if [ "$s" -ne 0 ]; then echo "$label run $i: a SKIP is not a result"; bad=1; continue; fi
              if [ "$want" = pass ]; then
                if [ "$p" -ne 1 ] || [ "$f" -ne 0 ] || [ "$r" -ne 0 ] || [ "$d" -ne 0 ]; then
                  echo "$label run $i: want PASS=1 FAIL=0 and no race report"; bad=1
                fi
              else
                if [ "$p" -ne 0 ] || [ "$f" -ne 1 ] || [ "$r" -lt 1 ] || [ "$d" -lt 1 ]; then
                  echo "$label run $i: want FAIL=1 with its own DATA RACE report (the mutant was not killed by the race detector in this process)"; bad=1
                fi
              fi
            done
            return "$bad"
          }
          run fixed CELERIS587_ZC_WINDOW_HOLD=2ms
          run zcoff CELERIS587_ZC_WINDOW_HOLD=2ms CELERIS_IOURING_SEND_ZC=off
          python3 .github/scripts/mutant-587-unlock-zc-first-cqe.py
          run mutant CELERIS587_ZC_WINDOW_HOLD=2ms
          git checkout -- engine/iouring/worker.go
          grep -h -A30 'WARNING: DATA RACE' /tmp/zc587-mutant-1.log | head -60 || true
          ok=0
          tally fixed pass || ok=1
          tally zcoff pass || ok=1
          tally mutant kill || ok=1
          exit "$ok"

  recv-theft:
    name: io_uring close paths never release a descriptor an op can still resolve (celeris#685, ${{ matrix.os }})
    # Both arches: the theft was measured on both (celeris#715).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      # The celeris#715 / celeris#685 trials (-tags=validation only; the
      # holds are internal/recvtheft). Each parks the worker that closed a
      # connection A with a recv still able to resolve A's descriptor number
      # (TestRecvTheft715ArmA: a recv SQE not yet submitted;
      # TestRecvTheft685Linked: a recv linked behind a SEND, not yet
      # issued), lets the sibling worker accept a fresh connection B, and
      # asserts that B is answered and that no stale recv read B's bytes.
      # On a tree that frees the number at the close, the sibling is given
      # it and the old recv reads B's request: both fail in every trial.
      # Their *Hole twins open a free number under A's once the closer is
      # parked: the sibling's accept of the hole tests nothing and is
      # skipped, so they must fail the same way (a verdict that counted it
      # passed a tree without the fix). TestRecvTheft715Control (the ring
      # submitted before the close) and TestRecvTheft715ArmC (celeris#715
      # hypothesis (c)) must pass either way.
      # The three TestRecvTheft685Hijack* arms hold the worker right after a
      # Hijack and send the hijacker's first bytes meanwhile: with multishot
      # recv (owed across its request) on a ring without DEFER_TASKRUN, the
      # recv reads them unless hijackConn submits its cancel first (Coop);
      # the DEFER_TASKRUN and single-shot arms pass either way.
      #
      # The trials need TWO io_uring workers (12 MiB of RLIMIT_MEMLOCK each;
      # the runner defaults to 8 MiB), so memlock is raised as in the
      # `iouring` job, and CELERIS_REQUIRE_IOURING_WORKERS=1 turns a missing
      # sibling into a failure. -v, -count=5, and a tally that requires
      # every run of every test to PASS, with no FAIL and no SKIP line: a
      # renamed test selects nothing and go test would still exit 0.
      - name: celeris#685 recv-theft trials (two workers, skipping forbidden)
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
          CELERIS_RECV_THEFT_715: "1"
        run: |
          set -o pipefail
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          echo "memlock (KiB): $(ulimit -l)"
          names='TestRecvTheft715ArmA|TestRecvTheft715ArmAHole|TestRecvTheft715Control|TestRecvTheft715ArmC|TestRecvTheft685Linked|TestRecvTheft685LinkedHole|TestRecvTheft685HijackSingleShot|TestRecvTheft685HijackMultishotDefer|TestRecvTheft685HijackMultishotCoop'
          runs=5
          want=$(( $(tr '|' '\n' <<<"$names" | wc -l) * runs ))
          go test -tags=validation -race -count="$runs" -timeout=600s -v -run "^(${names})\$" \
            ./engine/iouring/ 2>&1 | tee /tmp/recvtheft685.log || true
          grep -E 'RECVTHEFT(715|685) .*result' /tmp/recvtheft685.log || true
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/recvtheft685.log || true)
          failed=$(grep -cE '^[[:space:]]*--- FAIL' /tmp/recvtheft685.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/recvtheft685.log || true)
          for n in ${names//|/ }; do
            echo "$n: PASS $(grep -cE "^--- PASS: $n \(" /tmp/recvtheft685.log || true) FAIL $(grep -cE "^--- FAIL: $n \(" /tmp/recvtheft685.log || true)"
          done
          echo "celeris#685 recv-theft trials: want $want PASS, passed $passed, FAIL lines $failed, SKIP lines $skipped"
          if [ "$passed" -ne "$want" ] || [ "$failed" -ne 0 ] || [ "$skipped" -ne 0 ]; then
            echo "expected exactly $want trial runs to PASS with no FAIL or SKIP line -- did a close path"
            echo "release a descriptor number a recv could still resolve, or was a test renamed or skipped?"
            exit 1
          fi
      # celeris#798: the rule counts only the ops that name the descriptor. A
      # SEND_ZC's notification names none, yet a peer that stops reading holds
      # it for as long as the socket is open. So it must not keep a closed
      # connection's descriptor (the release backstop forced it after 5 s and
      # counted CloseFDForced), nor stall worker shutdown's drain, while the
      # connState, whose send buffer the notification guards, still waits for
      # it. The unit job runs these two tests in its package step, on x86 only;
      # here they run on both arches, by name, at the runner's own 8 MiB
      # memlock (the pages SEND_ZC pins count against it), with a tally: every
      # run of each of the five cases must PASS, with no FAIL and no SKIP line.
      # A SKIP would mean the runner's kernel gave the engine no working
      # SEND_ZC, so nothing was tested.
      - name: celeris#798 a SEND_ZC notification holds no descriptor (both arches, skipping forbidden)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          names='TestCloseReleasesDescriptorWithOnlyAZCNotificationOwed|TestShutdownDoesNotWaitForAZCNotification'
          runs=3
          want=$(( $(tr '|' '\n' <<<"$names" | wc -l) * runs ))
          wantsub=$(( 5 * runs ))
          go test -race -count="$runs" -timeout=300s -v -run "^(${names})\$" \
            ./engine/iouring/ 2>&1 | tee /tmp/zc798.log || true
          grep -E 'celeris798 ' /tmp/zc798.log || true
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/zc798.log || true)
          subpassed=$(grep -cE "^    --- PASS: (${names})/" /tmp/zc798.log || true)
          failed=$(grep -cE '^[[:space:]]*--- FAIL' /tmp/zc798.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/zc798.log || true)
          echo "celeris#798 SEND_ZC tests: want $want PASS ($wantsub cases), passed $passed ($subpassed cases), FAIL lines $failed, SKIP lines $skipped"
          if [ "$passed" -ne "$want" ] || [ "$subpassed" -ne "$wantsub" ] || [ "$failed" -ne 0 ] || [ "$skipped" -ne 0 ]; then
            echo "expected exactly $want runs ($wantsub cases) to PASS with no FAIL or SKIP line -- did a"
            echo "SEND_ZC notification hold a descriptor or stall shutdown, or was a test renamed or skipped?"
            exit 1
          fi
      # celeris#812: the release backstop gave up a closed connection 5 s after
      # the close whatever it still owed, to connStatePool with its send buffer.
      # With a SEND_ZC's notification owed, the kernel was still sending the
      # unsent tail from that array to a peer that had stopped reading, and the
      # array's next owner overwrote it: the peer got another connection's
      # bytes. The backstop now holds such a send buffer until the notification,
      # off the release walk, keeping the array alone, in gauges, and with no
      # new SEND_ZC armed while a worker holds 16 MiB; worker shutdown keeps the
      # buffers the ring closes on. Both arches, by name, at the runner's own
      # 8 MiB memlock (the pages SEND_ZC pins count against it), -race, three
      # runs, with a tally: every run of each of the ten tests and their
      # twenty-four cases must PASS, with no FAIL and no SKIP line. A SKIP
      # would mean the runner gave the engine no working SEND_ZC.
      - name: celeris#812 a SEND_ZC's send buffer outlives the release backstop (both arches, skipping forbidden)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          names='TestBackstopHoldsASendBufferAZCNotificationStillReads|TestBackstopCountsItsZCHolds|TestPendingReleaseBackstopHoldsAZCSendPastItsDeadline|TestClosedOpsCountsTheZCSendApart|TestDroppingAnIdentityWithAZCOwedIsCounted|TestShutdownRetainsSendBuffersAZCMayStillRead|TestZCHoldIsOffTheReleaseWalk|TestZCHoldKeepsOnlyTheSendBuffer|TestZCHoldCoversACollidingSibling|TestSendZCStopsWhileHeldBuffersReachTheCap'
          runs=3
          want=$(( $(tr '|' '\n' <<<"$names" | wc -l) * runs ))
          wantsub=$(( 24 * runs ))
          go test -race -count="$runs" -timeout=300s -v -run "^(${names})\$" \
            ./engine/iouring/ 2>&1 | tee /tmp/zc812.log || true
          grep -E 'celeris812 ' /tmp/zc812.log || true
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/zc812.log || true)
          subpassed=$(grep -cE "^    --- PASS: (${names})/" /tmp/zc812.log || true)
          failed=$(grep -cE '^[[:space:]]*--- FAIL' /tmp/zc812.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/zc812.log || true)
          echo "celeris#812 tests: want $want PASS ($wantsub cases), passed $passed ($subpassed cases), FAIL lines $failed, SKIP lines $skipped"
          if [ "$passed" -ne "$want" ] || [ "$subpassed" -ne "$wantsub" ] || [ "$failed" -ne 0 ] || [ "$skipped" -ne 0 ]; then
            echo "expected exactly $want runs ($wantsub cases) to PASS with no FAIL or SKIP line -- did the backstop"
            echo "give up a send buffer a SEND_ZC still reads, or was a test renamed or skipped?"
            exit 1
          fi
      # Its detector control. .github/scripts/mutant-812-backstop-releases-zc.py
      # disables the hold, so the backstop releases the connState with its send
      # buffer as before the fix. Every run of each of the four wire cases must
      # then report the release (held_past_backstop=false) and bytes on the wire
      # that were not sent (corrupt_bytes above 0), and FAIL. A runner whose
      # kernel copied the send before the release would let the wire test pass
      # with or without the fix; this is what shows it does not. The mutation is
      # undone before the step ends.
      - name: celeris#812 detector control (the hold removed; every run of the four wire cases must see foreign bytes)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          python3 .github/scripts/mutant-812-backstop-releases-zc.py
          runs=3
          log=/tmp/zc812-mutant.log
          go test -race -count="$runs" -timeout=300s -v -run '^TestBackstopHoldsASendBufferAZCNotificationStillReads$' \
            ./engine/iouring/ 2>&1 | tee "$log" || true
          git checkout -- engine/iouring/worker.go
          bad=0
          for c in notif-only recv-and-notif send-done-after-close detached-notif-only; do
            lines=$(grep -cE "celeris812 backstop case=$c " "$log" || true)
            det=$(grep -E "celeris812 backstop case=$c " "$log" | grep -cE ' held_past_backstop=false .* corrupt_bytes=[1-9]' || true)
            f=$(grep -cE "^    --- FAIL: TestBackstopHoldsASendBufferAZCNotificationStillReads/$c \(" "$log" || true)
            echo "mutant, case $c: result lines $lines, detected $det, FAIL $f (want $runs, $runs, $runs)"
            if [ "$lines" -ne "$runs" ] || [ "$det" -ne "$runs" ] || [ "$f" -ne "$runs" ]; then bad=1; fi
          done
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' "$log" || true)
          if [ "$skipped" -ne 0 ]; then echo "a SKIP is not a result ($skipped SKIP lines)"; bad=1; fi
          exit "$bad"
      # The detector control. .github/scripts/mutant-685-release-owed-fd.py
      # makes fdOwed report false, which takes the fd-lifetime rule off the
      # close paths, Hijack and shutdown at once. Against that tree every run
      # of the five trials that judge the rule must DETECT the theft, read
      # from its result line, not from its --- line: a FAIL for any other
      # reason (INCONCLUSIVE, a setup error, a race report) is not a
      # detection. The close-path trials (ArmA, ArmAHole, Linked, LinkedHole)
      # must report hit=true, reused=true and stolen=true: the sibling was
      # given A's number and A's stale recv read B's request. The hijack
      # trial (MultishotCoop) must report op_owed=+1 and hijacker_read=false.
      # The trials that pass on any tree must still PASS. No trial judges the
      # shutdown half of the rule (see the script). The mutation is undone
      # before the step ends.
      - name: celeris#685 detector control (the rule removed; every run of the five judging trials must detect the theft)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
          CELERIS_RECV_THEFT_715: "1"
        run: |
          set -o pipefail
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          python3 .github/scripts/mutant-685-release-owed-fd.py
          others='TestRecvTheft715Control|TestRecvTheft685HijackSingleShot|TestRecvTheft685HijackMultishotDefer'
          runs=3
          log=/tmp/recvtheft685-mutant.log
          go test -tags=validation -race -count="$runs" -timeout=600s -v \
            -run "^(TestRecvTheft715ArmA|TestRecvTheft715ArmAHole|TestRecvTheft685Linked|TestRecvTheft685LinkedHole|TestRecvTheft685HijackMultishotCoop|${others})\$" \
            ./engine/iouring/ 2>&1 | tee "$log" || true
          git checkout -- engine/iouring/fd_lifetime.go
          grep -E 'RECVTHEFT(715|685) .*result' "$log" || true
          bad=0
          # judged <test> <its result line> <the detection that line must report>
          judged() {
            local n=$1 line=$2 want=$3 lines det p
            lines=$(grep -cE "$line" "$log" || true)
            det=$(grep -E "$line" "$log" | grep -cE "$want" || true)
            p=$(grep -cE "^--- PASS: $n \(" "$log" || true)
            echo "mutant, judged $n: result lines $lines, detected $det, PASS $p (want $runs, $runs, 0)"
            if [ "$lines" -ne "$runs" ] || [ "$det" -ne "$runs" ] || [ "$p" -ne 0 ]; then bad=1; fi
          }
          stolen=' hit=true .* reused=true .* stolen=true '
          judged TestRecvTheft715ArmA 'RECVTHEFT715 arm=A result ' "$stolen"
          judged TestRecvTheft715ArmAHole 'RECVTHEFT715 arm=A-hole result ' "$stolen"
          judged TestRecvTheft685Linked 'RECVTHEFT685 linked result ' "$stolen"
          judged TestRecvTheft685LinkedHole 'RECVTHEFT685 linked-hole result ' "$stolen"
          judged TestRecvTheft685HijackMultishotCoop 'RECVTHEFT685 hijack result tier=2 ' ' op_owed=\+1 .* hijacker_read=false '
          for n in ${others//|/ }; do
            p=$(grep -cE "^--- PASS: $n \(" "$log" || true)
            f=$(grep -cE "^--- FAIL: $n \(" "$log" || true)
            echo "mutant, control $n: PASS $p FAIL $f (want PASS $runs)"
            if [ "$p" -ne "$runs" ] || [ "$f" -ne 0 ]; then bad=1; fi
          done
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' "$log" || true)
          if [ "$skipped" -ne 0 ]; then echo "a SKIP is not a result ($skipped SKIP lines)"; bad=1; fi
          exit "$bad"

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: Conformance matrix (engines × protocols)
        run: go test -v -race -count=1 -timeout=120s ./test/conformance/...

  driver-conformance:
    name: Driver Conformance (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: celeris
          POSTGRES_USER: celeris
          POSTGRES_DB: celeristest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U celeris -d celeristest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CELERIS_PG_DSN: postgres://celeris:celeris@127.0.0.1:5432/celeristest?sslmode=disable
      CELERIS_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: Postgres conformance
        run: >-
          go test -tags postgres -race -count=1 -timeout=300s
          ./test/conformance/postgres/...
      - name: Redis conformance
        run: >-
          go test -tags redis -race -count=1 -timeout=300s
          ./test/conformance/redis/...
      - name: Postgres session store integration
        run: >-
          go test -tags integration -race -count=1 -timeout=120s
          ./middleware/session/postgresstore/...
      - name: Redis session store integration
        run: >-
          go test -tags integration -race -count=1 -timeout=120s
          ./middleware/session/redisstore/...

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: Build root module
        run: go build ./...
      - name: Build middleware/compress
        run: go build ./...
        working-directory: middleware/compress
      - name: Build middleware/metrics
        run: go build ./...
        working-directory: middleware/metrics
      - name: Build middleware/otel
        run: go build ./...
        working-directory: middleware/otel
      - name: Build middleware/protobuf
        run: go build ./...
        working-directory: middleware/protobuf

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      # govulncheck is a `tool` of the separate .github/tools module, so the
      # version that runs is the one its go.mod names and its go.sum hashes
      # (Dependabot bumps it), not whatever @latest resolves to on the day.
      # -modfile builds the tool from that module while each step stays in the
      # module it scans; the vulnerability database is still fetched live from
      # vuln.go.dev on every run (celeris#827).
      - name: Build govulncheck (pinned by .github/tools/go.sum)
        run: go tool -modfile="$GITHUB_WORKSPACE/.github/tools/go.mod" govulncheck -version
      - name: Root module
        run: go tool -modfile="$GITHUB_WORKSPACE/.github/tools/go.mod" govulncheck ./...
      - name: middleware/compress
        run: go tool -modfile="$GITHUB_WORKSPACE/.github/tools/go.mod" govulncheck ./...
        working-directory: middleware/compress
      - name: middleware/metrics
        run: go tool -modfile="$GITHUB_WORKSPACE/.github/tools/go.mod" govulncheck ./...
        working-directory: middleware/metrics
      - name: middleware/otel
        run: go tool -modfile="$GITHUB_WORKSPACE/.github/tools/go.mod" govulncheck ./...
        working-directory: middleware/otel
      - name: middleware/protobuf
        run: go tool -modfile="$GITHUB_WORKSPACE/.github/tools/go.mod" govulncheck ./...
        working-directory: middleware/protobuf

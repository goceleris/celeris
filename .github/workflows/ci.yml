name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Flaky jobs (`test`, `spec`, `integration`, `bench`) were removed
# 2026-04-28. They timed out unpredictably on shared GitHub Actions
# runners — race-detector + Azure-runner-cold-start blew the
# TestAdaptiveH2DialNoRSTRace bind deadline; h2spec hit timing limits
# under -race; integration's fakePG harness wedged on extended-protocol
# queries. Real correctness validation lives in the adversarial cluster
# matrix run by goceleris/probatorium (race + checkptr + fail-fast on
# real hardware) and the spec/integration tests run locally before merge.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      # Magefiles carry `//go:build mage`, so `go vet ./...`, `go build` and
      # `go test` ALL skip them — only mage itself compiles them, which means a
      # broken magefile can reach main green. Compile them here.
      - name: Install mage
        run: |
          go install github.com/magefile/mage@v1.17.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: mage compiles
        run: mage -compile /tmp/mage-compile-check
      # Every hand-written version stamp (server.go Version, the sub-module
      # pins, the README heading) must agree; the release workflow refuses to
      # tag while they disagree with the tag, and this refuses a PR that
      # leaves them disagreeing with each other. `VERSION=vX.Y.Z mage
      # PrepRelease` moves all of them at once.
      - name: Release stamps agree
        run: mage CheckRelease

      - name: Lint root module
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13
      - name: Lint middleware/compress
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13
          working-directory: middleware/compress
      - name: Lint middleware/metrics
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13
          working-directory: middleware/metrics
      - name: Lint middleware/otel
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13
          working-directory: middleware/otel
      - name: Lint middleware/protobuf
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13
          working-directory: middleware/protobuf
      - name: actionlint
        # Workflow-YAML lint: catches script-injection vectors, unknown
        # runner labels, malformed shell, action input misuse — the
        # whole class golangci-lint can't see. Pinned to an exact version
        # so a new actionlint release cannot turn main red on its own.
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint -color
      - name: zizmor
        # Workflow security audit (unpinned actions, persisted credentials,
        # template injection, excessive permissions). Complements
        # actionlint, which checks syntax rather than security posture.
        # Needs only the ephemeral job token (read) for the online audits;
        # no repository secrets. Pinned to an exact version.
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec zizmor==1.30.0 zizmor --color always .github/workflows

  unit:
    name: Unit (root + middleware sub-modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      # Excludes ./test/... to keep this job deterministic — those
      # suites (integration, spec, sustainedload) are timing-sensitive
      # on shared GitHub Actions runners and run locally / in the
      # goceleris/probatorium cluster matrix instead.
      #
      # Excludes ./adaptive/... because it runs in its own job, `adaptive`
      # below, which raises memlock so the up-switch tests execute
      # (celeris#641).
      #
      # ./engine/iouring DOES run here, at the runner's own 8 MiB memlock.
      # The three celeris#656 worker-init tests cannot run at that limit (they
      # need two io_uring workers) and skip; the `iouring` job below runs those
      # three with memlock raised and skipping forbidden.
      #
      # Excludes ./middleware/websocket because TestNativeEngineClose
      # FrameEcho/io_uring drives 13 close-handshake round trips on a
      # native io_uring engine and intermittently overruns its 30s
      # sub-test budget on Azure runners under -race (each handshake is
      # ~2-3s on a cold instance). The same suite is race-clean on
      # msr1 + Multipass and is exercised end-to-end by the
      # autobahn-fuzzingclient test under `mage testAutobahn`.
      - name: Root module — race tests (excluding test/ + adaptive/ + websocket)
        run: |
          pkgs=$(go list ./... | grep -vE '/test/|/adaptive($|/)|/middleware/websocket($|/)')
          # shellcheck disable=SC2086  # word-splitting is intentional — `go test` wants one package per arg
          go test -race -count=1 -timeout=300s $pkgs
      # celeris#657: the step above runs ./engine/iouring WITHOUT -v, so a skip
      # there prints nothing and the package still reports `ok`. That is how the
      # celeris#656 leak shipped with no cover. Most celeris#657 tests can skip:
      # they build a ring through newTestRing, build io_uring workers, or start
      # a whole io_uring engine. That holds for the eleven hand-off loss witness
      # tests (PR-1, the first list), the eighteen fd-lifetime tests (PR-2,
      # the second list; eight of them pin the async-cancel-flags probe, the
      # reap-failure and dup-failure paths and the reaped recv's cleanup), the
      # six post-switch sweep tests (PR-3, the third list: the wake poll,
      # the sweep reaching an idle conn through the reap, and the four cases in
      # which it must NOT ask -- no cancel flags, work already owed, a claim
      # already made, a detached WebSocket conn) and the five the PR-3 review
      # added (the fourth list: a connection that joins a cycle past the
      # cursor, the bound on what the rule that catches it may cost, the
      # classifier's lock, a connection that has sent no byte, and the
      # retraction of the residual gauges). So all forty run again here by
      # name, with the PASS-count interlock the `iouring` job uses
      # (celeris#664): -v, CELERIS_REQUIRE_IOURING_WORKERS=1 to turn every
      # environment skip into a failure, and an exact tally.
      #
      # The tally counts TOP-LEVEL results: `=== RUN   Name` with nothing after
      # the name, and `--- PASS: Name (`. go test prints the elapsed time after
      # the name, so the PASS pattern must not end at the name. The step also
      # fails on ANY `--- SKIP` line. The expected count comes from the name
      # list. memlock stays at the runner's 8 MiB, the shape the step above
      # runs these tests in. TestWorkersShareTheHandoffLossWitnesses builds
      # TWO workers through createWorkers, which skips the 12 MiB-per-worker
      # ceiling the Listen path applies; that the pair fits in 8 MiB is
      # measured (CI and local runner-shape containers), not guaranteed. If a
      # later change makes them not fit, the require-workers env turns the
      # ENOMEM into a red job instead of a skip. That is intended.
      #
      # That 8 MiB is also what makes this the one-worker leg of the
      # fd-lifetime tests: through the Listen path it funds a single io_uring
      # worker, the shape in which every hand-off loss was measured (all
      # connections on one ring). Each engine-level fd-lifetime test logs
      # "celeris657 engine workers=N"; the step requires at least one such
      # line and every one to read workers=1, so a runner that funds more
      # workers fails here instead of silently testing another shape.
      - name: celeris#657 hand-off witness, fd-lifetime and sweep tests, one io_uring worker (skipping forbidden)
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          pr1='TestStaleRecvDataCountsATransplantedConn|TestStaleRecvDataCountsAnAsyncTransplantedConn|TestStaleRecvDataCountsAClosedConn|TestStaleRecvDataCountsAnUnattributedIdentity|TestStaleRecvDataIgnoresCompletionsWithoutData|TestStaleRecvDataCountsEachMultishotCompletion|TestTransplantHandoffInFlightCountsTryTransplant|TestTransplantHandoffInFlightCountsFinishAsyncTransplant|TestMetricsCarriesTheHandoffLossWitnesses|TestWorkersShareTheHandoffLossWitnesses|TestClosedOpsEntryStaysThirtyTwoBytes'
          pr2='TestTransplantNeverHandsOffArmedRecv|TestTransplantReapMissIsRetried|TestHoldReleasedWhenDrainStops|TestHoldRescuedByCheckTimeouts|TestOneOwnerPerHandoff|TestNoDrainSQESequenceIsUnchanged|TestHandoffHasNothingInFlight|TestStaleRecvDataCounted|TestHeldRecvIsReArmedWhenTheHandOffDoesNotHappen|TestWorkerParksWithNothingPending|TestTransplantReapFailureIsNotRetried|TestNoReapWithoutAsyncCancelFlags|TestReapSuppressedAfterFailedHandOff|TestReapedRecvLeavesNoLinkOrBuffer|TestAsyncCancelProbeClassifies|TestAsyncCancelProbeOnThisKernel|TestWorkersCarryTheAsyncCancelProbe|TestReapOnTheRunningKernel'
          pr3='TestWorkerAskWakesTheRing|TestQuiesceMovesAnIdleConn|TestSweepDoesNotSpinWithoutCancelFlags|TestSweepSkipsAConnWithWorkAlreadyOwed|TestSweepDoesNotReClaimAnAsyncHandoff|TestSweepLeavesADetachedConnAlone'
          pr3r2='TestSweepCannotGoDormantWithAnUnexaminedArrival|TestSweepCostIsBoundedUnderContinuousArrivals|TestSweepClassifiesUnderTheLockTheEngineRequires|TestSweepGoesDormantOnAConnThatHasSentNothing|TestResidualGaugeRetractsWhatTheWorkerNoLongerHolds'
          names="${pr1}|${pr2}|${pr3}|${pr3r2}"
          want=$(( $(tr '|' '\n' <<<"$names" | wc -l) ))
          go test -race -count=1 -timeout=300s -v -run "^(${names})\$" \
            ./engine/iouring/ 2>&1 | tee /tmp/witness657.log
          ran=$(grep -cE "^=== RUN   (${names})\$" /tmp/witness657.log || true)
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/witness657.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/witness657.log || true)
          engines=$(grep -cE 'celeris657 engine workers=[0-9]+$' /tmp/witness657.log || true)
          one=$(grep -cE 'celeris657 engine workers=1$' /tmp/witness657.log || true)
          echo "celeris#657 witness and fd-lifetime tests: want $want, ran $ran, passed $passed, SKIP lines $skipped, engines $engines at workers=1: $one"
          if [ "$ran" -ne "$want" ] || [ "$passed" -ne "$want" ] || [ "$skipped" -ne 0 ] || [ "$engines" -eq 0 ] || [ "$one" -ne "$engines" ]; then
            echo "expected exactly $want top-level celeris#657 tests to run and PASS with no SKIP line, and"
            echo "every engine at one io_uring worker -- was one renamed or removed, did one skip or fail,"
            echo "or did this runner fund a different worker count?"
            exit 1
          fi
      # celeris#657 PR-3: the same silent-exclusion shape, one package over.
      # ./engine/epoll is reached only by the root step above, which runs
      # without -v, so a skip there prints nothing and the package still
      # reports `ok`. Two of the post-switch sweep tests start a REAL
      # epoll engine and t.Skip when it does not come up
      # (sweep_engine_test.go), and they are the two that prove face 1 on a
      # real engine: an idle keep-alive is handed over although its client
      # never sends another byte. A rename or an environment skip would take
      # them out of CI with no red.
      #
      # Seventeen names, in two lists: r1 is the eight this PR first shipped,
      # r2 the nine the review added (sweep_r2_test.go -- the cycle rule and
      # its cost bound, the classifier's lock under -race, the ask's
      # permanent-class pre-check, the release belt over the batch being
      # drained, the pending count, the two gauge retractions and the
      # connection that has sent no byte). All seventeen run here by name with
      # the interlock the step above uses: -v, exact top-level RUN and PASS
      # counts, and no `--- SKIP` line anywhere. Two further censuses make the engine cells impossible to
      # lose quietly. Both build their engine with Resources.Workers=2, so
      # every "epoll engine listening" line must read loops=2 -- a runner that
      # resolves a different loop count fails here instead of silently testing
      # another shape. And each prints one SWEEPIDLE line, after the engine
      # bound and after its premise held, so requiring exactly two of them is
      # what says both cells really reached a running engine.
      #
      # No memlock is raised and none is needed: epoll does not allocate
      # locked ring memory, so this step is the same shape on any runner.
      # It runs even when the io_uring step above failed -- the two share no
      # engine, and a known flake there must not hide this one's result.
      - name: celeris#657 epoll post-switch sweep tests (skipping forbidden)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          r1='TestSweepMovesIdleConnsWithoutTraffic|TestSweepMovesIdleAsyncConnsWithoutTraffic|TestSweepStopsWithTheDrain|TestSweepGoesDormantOnPermanentResidue|TestSweepBudgetCoversEveryConnAcrossPasses|TestSweepCadenceBacksOffAndResets|TestAskNeverOutlivesConnState|TestSweepDoesNotBlockOnADetachedConnsLock'
          r2='TestSweepCannotGoDormantWithAnUnexaminedArrival|TestSweepCostIsBoundedUnderContinuousArrivals|TestSweepClassifiesUnderTheLockTheEngineRequires|TestParkAskSkipsWhatTheHandoffCannotAccept|TestDropAskWithdrawsFromTheBatchBeingDrained|TestAskPendingCountsTheQueue|TestResidualGaugeRetractsWhatTheLoopNoLongerHolds|TestResidualGaugeRetractsAtShutdown|TestSweepGoesDormantOnAConnThatHasSentNothing'
          names="${r1}|${r2}"
          want=$(( $(tr '|' '\n' <<<"$names" | wc -l) ))
          go test -race -count=1 -timeout=300s -v -run "^(${names})\$" \
            ./engine/epoll/ 2>&1 | tee /tmp/sweep657.log
          ran=$(grep -cE "^=== RUN   (${names})\$" /tmp/sweep657.log || true)
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/sweep657.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/sweep657.log || true)
          engines=$(grep -cE 'epoll engine listening .*loops=[0-9]+' /tmp/sweep657.log || true)
          two=$(grep -cE 'epoll engine listening .*loops=2( |$)' /tmp/sweep657.log || true)
          idle=$(grep -cE 'celeris657 SWEEPIDLE async=(true|false) adopted=' /tmp/sweep657.log || true)
          echo "celeris#657 epoll sweep tests: want $want, ran $ran, passed $passed, SKIP lines $skipped, epoll engines $engines at loops=2: $two, SWEEPIDLE lines $idle (want 2)"
          if [ "$ran" -ne "$want" ] || [ "$passed" -ne "$want" ] || [ "$skipped" -ne 0 ] || [ "$engines" -eq 0 ] || [ "$two" -ne "$engines" ] || [ "$idle" -ne 2 ]; then
            echo "expected exactly $want top-level celeris#657 epoll sweep tests to run and PASS with no SKIP"
            echo "line, every epoll engine at two loops, and both idle-sweep cells to reach their SWEEPIDLE"
            echo "line -- was one renamed or removed, did one skip or fail, or did this runner resolve a"
            echo "different loop count?"
            exit 1
          fi
      - name: middleware/compress
        run: go test -race -count=1 -timeout=120s ./...
        working-directory: middleware/compress
      - name: middleware/metrics
        run: go test -race -count=1 -timeout=120s ./...
        working-directory: middleware/metrics
      - name: middleware/otel
        run: go test -race -count=1 -timeout=120s ./...
        working-directory: middleware/otel
      - name: middleware/protobuf
        run: go test -race -count=1 -timeout=120s ./...
        working-directory: middleware/protobuf
      - name: middleware/websocket — backpressure tests
        env:
          WS484_CONNS: "16"
          WS484_BURSTS: "2"
          WS484_BURST_FRAMES: "1000"
        run: go test -race -count=1 -timeout=120s -run '^TestBackpressure' ./middleware/websocket/...

  adaptive:
    name: Adaptive engine (./adaptive/...)
    runs-on: ubuntu-latest
    # 30, not 20, since celeris#657 PR-3 un-quarantined TestBidirectionalFlapAsync
    # (three promote/revert flaps over 64 loaded keep-alives) into the first step.
    # The two steps' own `go test -timeout` values are 900s and 300s, so the job
    # limit stays above their sum and a hung test is still killed by go test,
    # with its stack, rather than by the runner with nothing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      # celeris#641: the default engine's own package ran in no CI job. It
      # needs two things the unit job does not give it.
      #
      # memlock above io_uring's per-worker ring budget: GitHub-hosted
      # runners default to 8 MiB, where adaptive.New correctly disables the
      # conns-per-worker up-switch, so the five tests whose claim is that
      # switch cannot pass. The step raises its own shell's limit; the test
      # processes inherit it.
      #
      # CELERIS_REQUIRE_UPSWITCH=1 turns those tests' environment skip into
      # a failure, so this job cannot go green by skipping them.
      #
      # Quarantined by name, each with its open issue. Delete the entry when
      # the issue closes: TestRampH1Sync and TestRampH1Async (celeris#662: a
      # switch drops the connections queued on the paused engine, and on a
      # GitHub runner a 2048-conn promotion loses about a third of them). The
      # other three up-switch tests keep running.
      #
      # TestBidirectionalFlapAsync was the third entry, quarantined for
      # celeris#657 itself. PR-3 fixes what it was failing on -- at a flap the
      # outgoing engine kept 35-51 of 64 connections on the base and 0 on the
      # fix, 8 of 8 each -- and it is un-skipped here under the lift rule the
      # design decision sets: only after >= 6 GitHub-hosted re-runs of
      # identical bytes all pass. Those re-runs are recorded on the PR. It is
      # in the placement tally below, so it cannot go quiet again.
      #
      # TestRampH1Async keeps its entry although PR-3 empties the outgoing
      # engine there too (0 of 2048 left behind, against 247-512 on the base).
      # Its quarantine is celeris#662's, not this one's, and the 2048-conn
      # ramp also loses connections to "read: reset" on BOTH the base and the
      # fix (celeris#686). Lift it with #662, not here.
      #
      # celeris#657 face 2 has its multi-ring gate here: TestFlapConnsPerRing
      # (T4) fixes both engines at two workers, so its 256 keep-alive
      # connections are 128 per io_uring ring whatever the runner funds, and
      # runs three promote/revert cycles under load. At raised memlock the two
      # revert tests below spread their 64 connections over several rings and
      # did not lose on the base; T4 lost requests in 8 of 8 base runs. The
      # tally makes T4 impossible to lose quietly: exactly one top-level RUN
      # and PASS, no SKIP line for it, and its own RESULT line must show both
      # engines at two workers and err=0 (the requests its clients lost).
      #
      # celeris#657 face 1 (PR-3, placement) has its gate here too. Nine cells
      # run in this same invocation: the four idle-keep-alive switch cells,
      # the two polled flaps, the slow async handler, the switch-order cell
      # and the un-quarantined TestBidirectionalFlapAsync. Every one of them
      # t.Skips under -short, and the whole set is what separates the base
      # from the fix, so the same interlock applies: exactly nine top-level
      # RUN and PASS, no `--- SKIP` line naming one of them, and one RESULT
      # line per cell. The eight PR-3 cells report err=0 w1=0 w2=0 on their
      # RESULT line -- no client lost a request, no recv outlived its
      # hand-off, no hand-off was made with an op in flight. The flap's own
      # verdict tolerates up to one lost request per connection, so its total
      # line is required to exist but its error count is not tightened here:
      # the evidence that it is 0 is local (8 of 8), not GitHub-hosted.
      - name: Adaptive — race tests (memlock raised, up-switch required)
        shell: bash
        env:
          CELERIS_REQUIRE_UPSWITCH: "1"
        run: |
          set -o pipefail
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          echo "memlock (KiB): $(ulimit -l)"
          go test -race -count=1 -timeout=900s -v \
            -skip '^(TestRampH1Sync|TestRampH1Async)$' \
            ./adaptive/... 2>&1 | tee /tmp/adaptive-race.log
          t4='TestFlapConnsPerRing'
          ran=$(grep -cE "^=== RUN   ${t4}\$" /tmp/adaptive-race.log || true)
          passed=$(grep -cE "^--- PASS: ${t4} \(" /tmp/adaptive-race.log || true)
          skipped=$(grep -cE "^[[:space:]]*--- SKIP: ${t4}[ /]" /tmp/adaptive-race.log || true)
          results=$(grep -cE 'S0T4 RESULT cycles=[0-9]+ conns=[0-9]+ wE=[0-9]+ wI=[0-9]+ ' /tmp/adaptive-race.log || true)
          clean=$(grep -cE 'S0T4 RESULT cycles=3 conns=256 wE=2 wI=2 conns_per_ring=128 ok=[0-9]+ err=0 ' /tmp/adaptive-race.log || true)
          echo "celeris#657 T4: want 1, ran $ran, passed $passed, SKIP lines $skipped, RESULT lines $results, at two workers with err=0: $clean"
          if [ "$ran" -ne 1 ] || [ "$passed" -ne 1 ] || [ "$skipped" -ne 0 ] || [ "$results" -ne 1 ] || [ "$clean" -ne 1 ]; then
            echo "expected TestFlapConnsPerRing to run once and PASS with no SKIP line, and its RESULT line to show"
            echo "both engines at two workers (128 connections per io_uring ring) and err=0 -- was it renamed or"
            echo "removed, did it skip, or did this runner fund a different worker count?"
            exit 1
          fi
          place='TestIdleConnsFollowSwitchPromoteSync|TestIdleConnsFollowSwitchPromoteAsync|TestIdleConnsFollowSwitchRevertSync|TestIdleConnsFollowSwitchRevertAsync|TestFlapConvergesPollSync|TestFlapConvergesPollAsync|TestSlowAsyncHandlerConverges|TestSwitchDoesNotAdoptOntoOutgoing|TestBidirectionalFlapAsync'
          pwant=$(( $(tr '|' '\n' <<<"$place" | wc -l) ))
          pran=$(grep -cE "^=== RUN   (${place})\$" /tmp/adaptive-race.log || true)
          ppassed=$(grep -cE "^--- PASS: (${place}) \(" /tmp/adaptive-race.log || true)
          pskipped=$(grep -cE "^[[:space:]]*--- SKIP: (${place})[ /]" /tmp/adaptive-race.log || true)
          presults=$(grep -cE 'celeris657 (IDLE-(promote|revert)|FLAPPOLL) async=(true|false) RESULT |S0SA RESULT |celeris657 B0 fired=|\[async=true\] total ok=[0-9]+ err=[0-9]+ \|' /tmp/adaptive-race.log || true)
          pclean=$(grep -cE 'celeris657 (IDLE-(promote|revert)|FLAPPOLL) async=(true|false) RESULT .* err=0 w1=0 w2=0 |S0SA RESULT .* err=0 census=|celeris657 B0 fired=true |\[async=true\] total ok=[0-9]+ err=[0-9]+ \|' /tmp/adaptive-race.log || true)
          echo "celeris#657 placement: want $pwant, ran $pran, passed $ppassed, SKIP lines $pskipped, RESULT lines $presults, clean $pclean"
          if [ "$pran" -ne "$pwant" ] || [ "$ppassed" -ne "$pwant" ] || [ "$pskipped" -ne 0 ] || [ "$presults" -ne "$pwant" ] || [ "$pclean" -ne "$presults" ]; then
            echo "expected exactly $pwant top-level celeris#657 placement tests to run and PASS with no SKIP line,"
            echo "and one RESULT line each: the eight PR-3 cells reporting err=0 w1=0 w2=0 (no client lost a"
            echo "request, no recv outlived its hand-off, no hand-off was made with an op in flight) and"
            echo "TestBidirectionalFlapAsync reporting its total. Was one renamed or removed, did one skip"
            echo "(-short skips all nine), or did a cell stop reaching its own measurement?"
            exit 1
          fi
      # celeris#657 PR-2: the one-worker leg of the two revert tests. The step
      # above raises memlock, so io_uring there runs several workers and
      # TestReverseTransplant / TestBidirectionalFlap never meet the shape in
      # which the io_uring -> epoll hand-off lost requests: every connection
      # on ONE io_uring ring. This step does not raise memlock. At the
      # runner's own 8 MiB io_uring is capped to one worker (12 MiB per
      # worker, engine/iouring/ring.go minMemlockPerWorker), and the step
      # requires at least one "io_uring engine listening" line and every one
      # to read workers=1, so a runner that funds more workers fails here
      # instead of silently testing another shape.
      #
      # Neither test reads a CELERIS_REQUIRE_* variable: they t.Skip when
      # io_uring is unavailable. The tally is what forbids that: it fails on
      # ANY `--- SKIP` line, and on any top-level count other than two RUN and
      # two PASS (same patterns as the unit job's celeris#657 step). It runs
      # even when the step above failed, so a known flake there cannot hide
      # this leg's result.
      #
      # Their verdicts tolerate up to one lost request per connection (err <=
      # 64), so a PASS alone does not mean nothing was lost: on the base, the
      # flap test PASSED once with 56 lost requests. The step therefore also
      # reads each test's own summary line (the revert test's "before revert"
      # line and the flap test's "total" line, both for async=false) and
      # requires err=0 on both.
      - name: Adaptive — one-worker revert tests (runner memlock, skipping forbidden)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          echo "memlock (KiB): $(ulimit -l)"
          names='TestReverseTransplant|TestBidirectionalFlap'
          want=$(( $(tr '|' '\n' <<<"$names" | wc -l) ))
          go test -race -count=1 -timeout=300s -v -run "^(${names})\$" \
            ./adaptive/ 2>&1 | tee /tmp/revert657.log
          ran=$(grep -cE "^=== RUN   (${names})\$" /tmp/revert657.log || true)
          passed=$(grep -cE "^--- PASS: (${names}) \(" /tmp/revert657.log || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/revert657.log || true)
          engines=$(grep -cE 'io_uring engine listening .*workers=[0-9]+' /tmp/revert657.log || true)
          one=$(grep -cE 'io_uring engine listening .*workers=1( |$)' /tmp/revert657.log || true)
          summaries=$(grep -cE '\[async=false\] (before revert: .*\| ok=[0-9]+ err=[0-9]+$|total ok=[0-9]+ err=[0-9]+ \|)' /tmp/revert657.log || true)
          lossless=$(grep -cE '\[async=false\] (before revert: .*\| ok=[0-9]+ err=0$|total ok=[0-9]+ err=0 \|)' /tmp/revert657.log || true)
          echo "celeris#657 one-worker revert tests: want $want, ran $ran, passed $passed, SKIP lines $skipped, io_uring engines $engines at workers=1: $one, summaries $summaries with err=0: $lossless"
          if [ "$ran" -ne "$want" ] || [ "$passed" -ne "$want" ] || [ "$skipped" -ne 0 ] || [ "$engines" -eq 0 ] || [ "$one" -ne "$engines" ] || [ "$summaries" -ne "$want" ] || [ "$lossless" -ne "$summaries" ]; then
            echo "expected exactly $want top-level revert tests to run and PASS with no SKIP line, every"
            echo "io_uring engine at one worker, and each test's summary line to report err=0 -- was one renamed"
            echo "or removed, did one skip or fail, did this runner fund a different worker count, or were"
            echo "requests lost (a PASS verdict tolerates up to one per connection)?"
            exit 1
          fi

  iouring:
    name: io_uring init-failure regression (./engine/iouring)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      # celeris#656: the three tests that pin the failed-worker listen-socket
      # leak ask for TWO io_uring workers on one port, and RLIMIT_MEMLOCK funds
      # one per 12 MiB (engine/iouring/ring.go minMemlockPerWorker). GitHub
      # -hosted runners default to 8 MiB, so in the `unit` job -- which runs
      # ./engine/iouring without raising memlock and without -v -- all three
      # skipped silently and the leak shipped with no CI cover.
      #
      # Same two ingredients as the `adaptive` job (celeris#641): raise memlock
      # for this shell, which the test process inherits, and set
      # CELERIS_REQUIRE_IOURING_WORKERS=1 so every environment skip in
      # init_failure_leak_linux_test.go becomes a failure.
      #
      # Scoped to those tests by -run rather than running the whole package
      # here: the rest of ./engine/iouring keeps running in `unit` at the
      # runner's own memlock, the shape it has been green in.
      #
      # `-run` is a regex over test names, so a rename would quietly select
      # nothing and go test would still exit 0 ("no tests to run"). The tally
      # below is the interlock: exactly three of these tests must report PASS.
      - name: io_uring worker init-failure leak tests (memlock raised, skipping forbidden)
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          echo "memlock (KiB): $(ulimit -l)"
          go test -race -count=1 -timeout=600s -v \
            -run '^TestListenCloses(ListenSocketsWhenEveryWorkerRingSetupFails|ListenSocketWhenOneWorkerRingSetupFails|ListenSocketRingAndEventfdWhenInitialSubmitFails)$' \
            ./engine/iouring/ 2>&1 | tee /tmp/iouring656.log
          passed=$(grep -cE '^--- PASS: TestListenCloses' /tmp/iouring656.log || true)
          echo "celeris#656 tests passed: $passed"
          if [ "$passed" -ne 3 ]; then
            echo "expected 3 celeris#656 tests to PASS, saw $passed -- were they renamed, or did they skip?"
            exit 1
          fi

  zc-window:
    name: io_uring SEND_ZC window under -race, with its detector control (celeris#587)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      # TestSendZCWindowGuardUnderRace holds the SEND_ZC first-CQE -> NOTIF
      # window open (validation.SetZCNotifDelay, -tags=validation only) while
      # a 64 KiB echo keeps the detached handler writing, and requires the
      # inline-egress guard to decline inside that window at least once.
      # Neither the root race step (no validation tag, ./middleware/websocket
      # excluded) nor the websocket step (-run '^TestBackpressure') reaches it.
      #
      # Three runs, each tallied on its own "--- PASS:" / "--- FAIL:" lines
      # (a SKIP is a failure: CELERIS_REQUIRE_IOURING_WORKERS=1):
      #   1. the tree as committed: must PASS, race-clean;
      #   2. CELERIS_IOURING_SEND_ZC=off: must PASS with every ZC witness at 0
      #      (the witnesses track SEND_ZC, not traffic);
      #   3. the MUTANT (.github/scripts/mutant-587-unlock-zc-first-cqe.py
      #      deletes the detachMu acquire in handleSend's CQE_F_MORE branch):
      #      must FAIL with a "WARNING: DATA RACE" report. This is what makes
      #      run 1 evidence: it proves the race detector watches this path.
      # memlock is raised for the same reason as the `iouring` job: io_uring
      # workers need 12 MiB each and the runner defaults to 8 MiB.
      - name: SEND_ZC window test, ZC-off branch control and the detachMu mutant
        shell: bash
        env:
          CELERIS_REQUIRE_IOURING_WORKERS: "1"
        run: |
          set -o pipefail
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          echo "memlock (KiB): $(ulimit -l)"
          run() { # label, then env assignments
            local label=$1; shift
            local rc=0
            env "$@" go test -tags=validation -race -count=1 -timeout=300s -v \
              -run '^TestSendZCWindowGuardUnderRace$' ./middleware/websocket/ \
              > "/tmp/zc587-$label.log" 2>&1 || rc=$?
            echo "$label rc=$rc"
            grep -E 'ZCWIN|^--- (PASS|FAIL|SKIP): TestSendZCWindowGuardUnderRace' "/tmp/zc587-$label.log" || true
          }
          tally() { # label pass-want fail-want race-want(0|1)
            local log="/tmp/zc587-$1.log"
            local p f s r
            p=$(grep -cE '^--- PASS: TestSendZCWindowGuardUnderRace \(' "$log" || true)
            f=$(grep -cE '^--- FAIL: TestSendZCWindowGuardUnderRace \(' "$log" || true)
            s=$(grep -cE '^[[:space:]]*--- SKIP' "$log" || true)
            r=$(grep -c 'WARNING: DATA RACE' "$log" || true)
            echo "$1: PASS=$p FAIL=$f SKIP=$s DATA_RACE=$r"
            [ "$s" -eq 0 ] || { echo "$1: a SKIP is not a result"; return 1; }
            [ "$p" -eq "$2" ] && [ "$f" -eq "$3" ] || { echo "$1: want PASS=$2 FAIL=$3"; return 1; }
            if [ "$4" -eq 1 ]; then [ "$r" -gt 0 ] || { echo "$1: the mutant produced no DATA RACE report"; return 1; }
            else [ "$r" -eq 0 ] || { echo "$1: unexpected DATA RACE report"; return 1; }; fi
          }
          run fixed CELERIS587_ZC_NOTIF_DELAY=2ms
          run zcoff CELERIS587_ZC_NOTIF_DELAY=2ms CELERIS_IOURING_SEND_ZC=off
          python3 .github/scripts/mutant-587-unlock-zc-first-cqe.py
          run mutant CELERIS587_ZC_NOTIF_DELAY=2ms
          git checkout -- engine/iouring/worker.go
          grep -A12 'WARNING: DATA RACE' /tmp/zc587-mutant.log | head -40 || true
          ok=0
          tally fixed 1 0 0 || ok=1
          tally zcoff 1 0 0 || ok=1
          tally mutant 0 1 1 || ok=1
          exit "$ok"

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - name: Conformance matrix (engines × protocols)
        run: go test -v -race -count=1 -timeout=120s ./test/conformance/...

  driver-conformance:
    name: Driver Conformance (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: celeris
          POSTGRES_USER: celeris
          POSTGRES_DB: celeristest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U celeris -d celeristest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CELERIS_PG_DSN: postgres://celeris:celeris@127.0.0.1:5432/celeristest?sslmode=disable
      CELERIS_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - name: Postgres conformance
        run: >-
          go test -tags postgres -race -count=1 -timeout=300s
          ./test/conformance/postgres/...
      - name: Redis conformance
        run: >-
          go test -tags redis -race -count=1 -timeout=300s
          ./test/conformance/redis/...
      - name: Postgres session store integration
        run: >-
          go test -tags integration -race -count=1 -timeout=120s
          ./middleware/session/postgresstore/...
      - name: Redis session store integration
        run: >-
          go test -tags integration -race -count=1 -timeout=120s
          ./middleware/session/redisstore/...

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - name: Build root module
        run: go build ./...
      - name: Build middleware/compress
        run: go build ./...
        working-directory: middleware/compress
      - name: Build middleware/metrics
        run: go build ./...
        working-directory: middleware/metrics
      - name: Build middleware/otel
        run: go build ./...
        working-directory: middleware/otel
      - name: Build middleware/protobuf
        run: go build ./...
        working-directory: middleware/protobuf

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Root module
        run: govulncheck ./...
      - name: middleware/compress
        run: govulncheck ./...
        working-directory: middleware/compress
      - name: middleware/metrics
        run: govulncheck ./...
        working-directory: middleware/metrics
      - name: middleware/otel
        run: govulncheck ./...
        working-directory: middleware/otel
      - name: middleware/protobuf
        run: govulncheck ./...
        working-directory: middleware/protobuf
